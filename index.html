<head>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="20K">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">

<title>20K Scorecard</title>

<style>
/* Layout: scorecard list that scrolls, turn panel pinned to the bottom of the screen */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f2f4f8; --line:#dce1e9;
  --fg:#18202c; --muted:#5d6878; --on-strong:#ffffff; --shadow:rgba(20,30,50,.10);
  --accent:#1f5fd6; --accent-soft:#e4ecfc;
  --good:#16833c; --good-soft:#e2f4e8;
  --bad:#c9302c; --bad-soft:#fbe8e7;
  --warn:#d06d10; --warn-soft:#fdf0e1;
  --purple:#7a3fc4; --key:#2a3341;
  --gold:#a56600; --gold-2:#b4500f;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --surface-2:#1e2632; --line:#2c3644;
  --fg:#e8edf4; --muted:#9aa6b6; --shadow:rgba(0,0,0,.45);
  --accent:#6f9dff; --accent-soft:#1b2a45; --good:#3fb96c; --good-soft:#15301f;
  --bad:#e9554e; --bad-soft:#3a1a19; --warn:#e48d33; --warn-soft:#3a2813;
  --purple:#b892ff; --key:#35404f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface-2:#1e2632; --line:#2c3644;
  --fg:#e8edf4; --muted:#9aa6b6; --shadow:rgba(0,0,0,.45);
  --accent:#6f9dff; --accent-soft:#1b2a45; --good:#3fb96c; --good-soft:#15301f;
  --bad:#e9554e; --bad-soft:#3a1a19; --warn:#e48d33; --warn-soft:#3a2813;
  --purple:#b892ff; --key:#35404f; color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:var(--ui)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed}

.app{max-width:760px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

/* Header */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:14px 12px}
h1{font:700 26px/1 var(--num);margin:0;letter-spacing:.01em}
h1 span{color:var(--muted);font-weight:600}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tool svg{width:16px;height:16px}
.tool.undo:not(:disabled){background:var(--warn);border-color:transparent;color:var(--on-strong)}
.tool.redo:not(:disabled){background:var(--good);border-color:transparent;color:var(--on-strong)}
.tool:disabled{opacity:.45}
.tool.danger{background:var(--bad);border-color:transparent;color:var(--on-strong)}

/* Winner */
.win{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on-strong);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:10px;text-align:center}
.win h2{margin:0;font:700 24px/1.15 var(--num);text-wrap:balance}
.win .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.win button{height:46px;padding:0 16px;border-radius:12px;border:0;font-weight:700;font-size:15px}
.win .replay{background:var(--on-strong);color:var(--gold-2)}
.win .fresh{background:rgba(0,0,0,.28);color:var(--on-strong)}

/* Score rows */
.list{flex:1;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;
  scroll-margin-bottom:calc(var(--panel-h,280px) + 12px);scroll-margin-top:12px}
.row.active{border:2px solid var(--accent);background:var(--accent-soft);padding:9px 13px}
.who{flex:1;min-width:0}
.namewrap{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;visibility:hidden}
.row.active .dot{visibility:visible;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.name{font:600 17px var(--ui);color:var(--fg);background:transparent;border:0;border-bottom:1px dashed transparent;
  width:100%;min-width:0;padding:2px 0;border-radius:0}
.name:focus{outline:none;border-bottom-color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;margin-top:2px;padding-left:18px}
.last{color:var(--purple);font-weight:600}
.hint{color:var(--muted)}
.nums{display:flex;gap:16px;text-align:right;flex:none}
.num small{display:block;font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num b{display:block;font:700 26px/1.1 var(--num);font-variant-numeric:tabular-nums;min-width:4.4ch}
.num.rem b{color:var(--accent)}
.row.won .num b{color:var(--good)}

/* Turn panel (pinned) */
.panel{position:sticky;bottom:0;margin-inline:-16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 24px var(--shadow)}
.msg{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1.5px solid;font-size:14px;line-height:1.35}
.msg strong{display:block;font-size:15px}
.msg svg{flex:none;width:20px;height:20px;margin-top:1px}
.msg.bad{background:var(--bad-soft);border-color:var(--bad)} .msg.bad svg{color:var(--bad)}
.msg.warn{background:var(--warn-soft);border-color:var(--warn)} .msg.warn svg{color:var(--warn)}
.turnline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.turnline > div{min-width:0}
.label{font-size:13px;color:var(--muted);margin-bottom:2px}
.label b{color:var(--fg)}
.turn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 34px/1.15 var(--num);font-variant-numeric:tabular-nums}
.base{color:var(--accent)}
.stolen{display:inline-flex;align-items:center;gap:7px;color:var(--fg);background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:10px;padding:0 10px}
.stolen small{font:700 11px var(--ui);letter-spacing:.1em;color:var(--accent)}
.stolen svg{width:14px;height:14px;color:var(--accent)}
.plus{color:var(--good)}
.plus.zero{color:var(--muted);opacity:.6}
.total{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.total b{color:var(--fg);font:700 16px var(--num);font-variant-numeric:tabular-nums}
.clear{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:600;font-size:14px;flex:none}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.key{height:52px;border-radius:12px;border:0;background:var(--key);color:var(--on-strong);font:700 17px var(--num);font-variant-numeric:tabular-nums;transition:transform .08s}
.key:active:not(:disabled){transform:scale(.95)}
.key.vol{background:var(--accent);letter-spacing:.06em}
.key.vol.pulse{animation:volpulse .5s ease-in-out 4}
@keyframes volpulse{50%{transform:scale(1.08);box-shadow:0 0 0 4px var(--accent-soft)}}
.tool.sound{padding:0 10px}
.tool.sound svg{width:18px;height:18px}
.tool.icon{width:38px;padding:0;justify-content:center}
.tool.icon svg{width:18px;height:18px}
.volhint{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:13px;line-height:1.3;color:var(--muted)}
.volhint svg{flex:none;width:14px;height:14px;color:var(--warn)}
.key.vol:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{height:54px;border-radius:12px;border:0;font-weight:700;font-size:17px;color:var(--on-strong)}
.pass{background:var(--bad)}
.ok{background:var(--good)}
.ok:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* Setup */
.setup{margin:auto;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;
  display:flex;flex-direction:column;gap:20px;margin-block:24px}
.setup h1{font-size:34px;text-align:center}
.setup h2{font-size:15px;margin:0 0 10px;font-weight:600}
.count{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.count button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:700 20px var(--num)}
.count button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.rules{margin:0;padding:12px 14px;background:var(--surface-2);border-radius:12px;font-size:14px;line-height:1.6;color:var(--muted);list-style:none}
.rules b{color:var(--fg);font-family:var(--num);font-variant-numeric:tabular-nums}
.version{margin:-8px 0 0;text-align:center;font-size:12px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.go{height:56px;border-radius:14px;border:0;background:var(--good);color:var(--on-strong);font-weight:700;font-size:18px}
.go.danger{background:var(--bad)}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);
  border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;color:var(--fg);
  transition:transform .08s}
.resume:active{transform:scale(.985)}
.resume .rt{flex:1;min-width:0}
.resume b{display:block;font-size:15px;color:var(--accent)}
.resume small{display:block;margin-top:2px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume svg{flex:none;width:18px;height:18px;color:var(--accent)}

/* Journal des tours */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;overscroll-behavior:contain}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-top h2{margin:0;font:700 20px var(--num)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.loghead,.logrow{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto 4.2em;gap:8px;align-items:baseline}
.loghead{padding:10px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.loghead span:nth-child(3),.loghead span:nth-child(4){text-align:right}
.logrow{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.logrow .ln{font:600 12px var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.logrow .lnm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow .lv{text-align:right;font-weight:600;color:var(--good);white-space:nowrap}
.logrow .lv.vol{color:var(--purple)}
.logrow .lv.none{color:var(--muted);font-weight:500}
.logrow .ls{text-align:right;font:700 15px var(--num);font-variant-numeric:tabular-nums}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

@media (max-width:400px){
  .num b{font-size:22px} .nums{gap:12px} .key{font-size:15px;height:50px} .turn{font-size:30px}
  .tool{padding:0 10px}
}
@media (max-width:380px){.nj{display:none} .nums{gap:10px}}
@media (prefers-reduced-motion:reduce){.key.vol.pulse{animation:none}.row.active .dot{animation:none}.key{transition:none}}
</style>

<body>
<div id="root"></div>

<script>
/* 20K — moteur de règles.
 *
 * Pur : aucune dépendance au DOM, au stockage, au son ou au réseau.
 * Utilisé tel quel par l'interface web, et plus tard par le serveur du mode
 * « salon » (chaque appareil envoie des actions, tout le monde rejoue avec ce
 * même fichier : impossible de diverger).
 *
 * État du jeu :
 *   {
 *     names:   ["Marie", ...],
 *     players: [{ score, last, started }, ...],
 *     current: 2,                      // index du joueur dont c'est le tour
 *     prevTurn:{ player, points } | null,  // dernier tour qui a marqué (source du vol)
 *     winner:  1 | null,
 *     turn:    { stolen, add },        // saisie en cours
 *     log:     [{ i, n, add, stolen, total, after, pass }, ...],
 *     past:    [snapshot, ...],        // annulation
 *     future:  [snapshot, ...]         // rétablissement
 *   }
 *
 * reduce(état, action) renvoie { state, error?, events? } et ne modifie jamais
 * l'état reçu.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var TARGET = 20000, MIN_OPEN = 1000, MIN_VOL = 3500;
  var SAY_REMAINING = 1500;  // la voix annonce le reste à 1 500 ou moins
  var VOL_SOUND_MIN = 1000;  // sirène seulement pour un vol de 1 000 et plus
  var STEPS = [50, 100, 200, 500, 1000];
  var HISTORY_MAX = 300;

  var fmt = function (n) { return Number(n).toLocaleString('fr-CA'); };
  var freshTurn = function () { return { stolen: 0, add: 0 }; };

  function createGame(names) {
    names = (names || []).map(function (n) { return String(n); });
    return {
      names: names,
      players: names.map(function () { return { score: 0, last: null, started: false }; }),
      current: 0, prevTurn: null, winner: null,
      turn: freshTurn(), log: [], past: [], future: []
    };
  }

  function nextIdx(s, i) { return (i + 1) % s.players.length; }

  // Le vol ne vise que le tour qui vient de se terminer, et il faut encore de la
  // place pour les points volés plus les 50 obligatoires.
  function volFits(s) {
    return !!s.prevTurn &&
      s.players[s.current].score + s.prevTurn.points + STEPS[0] <= TARGET;
  }

  function canVol(s) {
    var p = s.players[s.current], t = s.prevTurn;
    return s.winner === null && !s.turn.stolen && p.score >= MIN_VOL &&
      !!t && t.points > 0 && t.player !== s.current && volFits(s);
  }

  // Raison lisible de l'état du bouton VOL (affichée sous les touches).
  function volReason(s) {
    var p = s.players[s.current], t = s.turn;
    if (p.score < MIN_VOL) return 'Nécessite ' + fmt(MIN_VOL) + ' points minimum';
    if (t.stolen) return 'Vol déjà fait ce tour';
    if (canVol(s)) return 'Voler le dernier score';
    if (s.prevTurn && s.prevTurn.points > 0 && !volFits(s)) return 'Pas assez de points restants pour ce vol';
    return 'Aucun score à voler';
  }

  // ---- Copies -------------------------------------------------------------
  function clone(s) {
    return {
      names: s.names.slice(),
      players: s.players.map(function (p) {
        return { score: p.score, last: p.last, started: p.started };
      }),
      current: s.current,
      prevTurn: s.prevTurn ? { player: s.prevTurn.player, points: s.prevTurn.points } : null,
      winner: s.winner,
      turn: { stolen: s.turn.stolen, add: s.turn.add },
      log: s.log.map(function (e) { return Object.assign({}, e); }),
      past: s.past.slice(),
      future: s.future.slice()
    };
  }

  // Les noms sont volontairement hors de l'historique : renommer ne s'annule pas.
  function snapshot(s) {
    return JSON.parse(JSON.stringify({
      players: s.players, current: s.current, prevTurn: s.prevTurn,
      winner: s.winner, turn: s.turn, log: s.log
    }));
  }

  function applySnapshot(s, x) {
    s.players = x.players.map(function (p) {
      return { score: p.score, last: p.last, started: p.started };
    });
    s.current = x.current;
    s.prevTurn = x.prevTurn ? { player: x.prevTurn.player, points: x.prevTurn.points } : null;
    s.winner = typeof x.winner === 'number' ? x.winner : null;
    s.turn = x.turn ? { stolen: x.turn.stolen, add: x.turn.add } : freshTurn();
    s.log = Array.isArray(x.log) ? x.log.map(function (e) { return Object.assign({}, e); }) : [];
  }

  function commit(s) {
    s.past.push(snapshot(s));
    if (s.past.length > HISTORY_MAX) s.past.shift();
    s.future = [];
  }

  // ---- Actions ------------------------------------------------------------
  function reduce(state, action) {
    var s = clone(state);
    var a = action || {};
    switch (a.type) {
      case 'add': {
        var v = Number(a.v);
        if (!isFinite(v) || v === 0) return { state: s };
        s.turn.add += v;
        return { state: s };
      }

      case 'vol':
        if (!canVol(s)) return { state: s };
        s.turn.stolen = s.prevTurn.points;
        return { state: s };

      case 'clear':
        if (s.turn.add) s.turn.add = 0; else s.turn.stolen = 0;
        return { state: s };

      case 'pass': {
        commit(s);
        var i = s.current;
        s.log.push({ i: i, n: s.log.length + 1, add: 0, stolen: 0, total: 0,
                     after: s.players[i].score, pass: true });
        s.prevTurn = null;
        s.current = nextIdx(s, i);
        s.turn = freshTurn();
        return { state: s, events: [{ type: 'passed', player: i }] };
      }

      case 'submit': {
        var j = s.current, p = s.players[j], t = s.turn;
        var total = t.stolen + t.add;
        if (!total) return { state: s };
        if (t.stolen && t.add === 0) {
          return { state: s, error: { kind: 'warn', title: 'Score invalide après un vol',
            text: 'Le score ne peut pas être identique au score volé.' } };
        }
        if (!p.started && total < MIN_OPEN) {
          return { state: s, error: { kind: 'bad', title: 'Score minimum requis',
            text: 'Le premier score doit être d\'au moins ' + fmt(MIN_OPEN) + ' points pour commencer à jouer.' } };
        }
        if (p.score + total > TARGET) {
          return { state: s, error: { kind: 'bad', title: 'Score trop élevé',
            text: 'Vous ne pouvez pas dépasser ' + fmt(TARGET) + ' points. Il reste ' +
                  fmt(TARGET - p.score) + ' points à ' + s.names[j] + '.' } };
        }
        commit(s);
        var before = p.score;
        p.score += total; p.last = total; p.started = true;
        s.log.push({ i: j, n: s.log.length + 1, add: t.add, stolen: t.stolen,
                     total: total, after: p.score, pass: false });
        s.prevTurn = { player: j, points: total };
        if (p.score === TARGET) s.winner = j; else s.current = nextIdx(s, j);
        s.turn = freshTurn();
        return { state: s, events: [{ type: 'scored', player: j, before: before, after: p.score,
          total: total, stolen: t.stolen, add: t.add, won: p.score === TARGET }] };
      }

      case 'undo':
        if (!s.past.length) return { state: s };
        s.future.push(snapshot(s));
        applySnapshot(s, s.past.pop());
        return { state: s, events: [{ type: 'undone' }] };

      case 'redo':
        if (!s.future.length) return { state: s };
        s.past.push(snapshot(s));
        applySnapshot(s, s.future.pop());
        return { state: s, events: [{ type: 'redone' }] };

      case 'rename': {
        var k = Number(a.i);
        if (!(k >= 0 && k < s.names.length)) return { state: s };
        s.names[k] = String(a.name == null ? '' : a.name);
        return { state: s };
      }

      default:
        return { state: s };
    }
  }

  // ---- Sauvegardes anciennes ou partielles --------------------------------
  function normalize(raw) {
    if (!raw || !Array.isArray(raw.players)) return null;
    var names = Array.isArray(raw.names) ? raw.names.slice() : [];
    var players = raw.players.map(function (p) {
      if (!p || typeof p.score !== 'number') return { score: 0, last: null, started: false };
      return { score: p.score,
               last: typeof p.last === 'number' ? p.last : null,
               started: typeof p.started === 'boolean' ? p.started : p.score > 0 };
    });
    players.forEach(function (p, i) {
      if (typeof names[i] !== 'string' || !names[i].trim()) names[i] = 'Joueur ' + (i + 1);
    });
    var isNum = function (v) { return typeof v === 'number' && isFinite(v); };
    var current = isNum(raw.current) ? raw.current : 0;
    if (current < 0 || current >= players.length) current = 0;
    var turn = (raw.turn && isNum(raw.turn.add) && isNum(raw.turn.stolen))
      ? { stolen: raw.turn.stolen, add: raw.turn.add } : freshTurn();
    var prevTurn = (raw.prevTurn && isNum(raw.prevTurn.player) && isNum(raw.prevTurn.points))
      ? { player: raw.prevTurn.player, points: raw.prevTurn.points } : null;
    var winner = isNum(raw.winner) && raw.winner >= 0 && raw.winner < players.length ? raw.winner : null;
    return {
      names: names, players: players, current: current,
      prevTurn: prevTurn, winner: winner, turn: turn,
      log: Array.isArray(raw.log) ? raw.log.filter(function (e) { return e && isNum(e.n); }) : [],
      past: Array.isArray(raw.past) ? raw.past.filter(function (x) { return x && Array.isArray(x.players); }) : [],
      future: Array.isArray(raw.future) ? raw.future.filter(function (x) { return x && Array.isArray(x.players); }) : []
    };
  }

  return {
    TARGET: TARGET, MIN_OPEN: MIN_OPEN, MIN_VOL: MIN_VOL,
    SAY_REMAINING: SAY_REMAINING, VOL_SOUND_MIN: VOL_SOUND_MIN,
    STEPS: STEPS, HISTORY_MAX: HISTORY_MAX,
    fmt: fmt, freshTurn: freshTurn,
    createGame: createGame, reduce: reduce, normalize: normalize,
    canVol: canVol, volFits: volFits, volReason: volReason
  };
});

</script>
<script>
/* 20K — interface (écran, son, voix, sauvegarde).
 * Toute la logique de jeu vient de Engine.reduce() ; ce fichier ne fait
 * qu'afficher l'état et traduire les taps en actions.
 */
(() => {
  const E = window.Engine;
  const { TARGET, MIN_OPEN, MIN_VOL, STEPS, SAY_REMAINING, VOL_SOUND_MIN } = E;
  const fmt = E.fmt;

  const KEY = '20k-scorecard-v1';
  const VERSION = '3.2';

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---- State -------------------------------------------------------------
  function fresh() {
    return Object.assign(E.createGame([]), { screen: 'setup', count: 4, sound: true });
  }
  // Older or partial saves must never break the render: Engine.normalize fills
  // in what is missing.
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (!raw || !raw.screen) return null;
      const g = E.normalize(raw);
      if (!g) return null;
      return Object.assign(g, {
        screen: (raw.screen === 'game' && g.players.length) ? 'game' : 'setup',
        count: typeof raw.count === 'number' ? raw.count : (g.players.length || 4),
        sound: raw.sound !== false
      });
    } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  let S = load() || fresh();
  let msg = null, msgTimer = 0;
  let confirmNew = false, confirmStart = false, confirmTimer = 0;
  let pulseVol = false;
  let sheet = null; // 'log' when the turn history is open

  // ---- Sounds: fanfare (a team reaches 3 500 = can steal from now on), siren (steal of 1 000+), buzzer (steal won't fit) ----
  let actx = null;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  function audio() {
    try {
      if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function siren() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03, dur = 1.6;
      const osc = a.createOscillator(), lp = a.createBiquadFilter(), gain = a.createGain();
      osc.type = 'sawtooth'; lp.type = 'lowpass'; lp.frequency.value = 2200;
      osc.frequency.setValueAtTime(650, t);
      for (let i = 0; i < 2; i++) {
        osc.frequency.linearRampToValueAtTime(1150, t + i * 0.8 + 0.4);
        osc.frequency.linearRampToValueAtTime(650, t + i * 0.8 + 0.8);
      }
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.2, t + 0.05);
      gain.gain.setValueAtTime(0.2, t + dur - 0.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(lp); lp.connect(gain); gain.connect(a.destination);
      osc.start(t); osc.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function tone(a, type, freq, start, dur, vol) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
    g.gain.setValueAtTime(vol, start + dur - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(a.destination); o.start(start); o.stop(start + dur + 0.02);
  }
  function fanfare() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03;
      [[523.25, 0, .14], [659.25, .14, .14], [783.99, .28, .14], [1046.5, .42, .55]].forEach(([f, st, d]) => {
        tone(a, 'square', f, t + st, d, 0.12); tone(a, 'triangle', f * 2, t + st, d, 0.05);
      });
    } catch (e) {}
  }
  function buzzer() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03;
      tone(a, 'sawtooth', 110, t, 0.8, 0.22); tone(a, 'square', 116, t, 0.8, 0.12);
    } catch (e) {}
  }
  // Winner: rising arpeggio, held chord, then a low root under it.
  function victory() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03;
      [[523.25, 0, .16], [659.25, .16, .16], [783.99, .32, .16], [1046.5, .48, .42],
       [1318.5, .94, .14], [1567.98, 1.08, .14]].forEach(([f, st, d]) => {
        tone(a, 'square', f, t + st, d, 0.12); tone(a, 'triangle', f * 2, t + st, d, 0.05);
      });
      [[1046.5, 1.24, 1.15], [1318.5, 1.24, 1.15], [1567.98, 1.24, 1.15]].forEach(([f, st, d]) => {
        tone(a, 'triangle', f, t + st, d, 0.09);
      });
      tone(a, 'sine', 261.63, t + 1.24, 1.15, 0.12);
    } catch (e) {}
  }
  // Called when a new turn starts after a score.
  function volAlert() {
    const p = S.players[S.current], t = S.prevTurn;
    if (!t || t.points <= 0 || t.player === S.current || p.score < MIN_VOL) return;
    if (!E.volFits(S)) return buzzer;
    pulseVol = true;
    if (t.points >= VOL_SOUND_MIN) return siren;
  }

  // ---- Voice: French female voice (Amélie on iPhone/iPad when available) ----
  let frVoice = null;
  function pickVoice() {
    try {
      const fr = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang));
      const pref = ['Amélie', 'Amelie', 'Audrey', 'Aurélie', 'Marie', 'Julie', 'Céline', 'Chantal', 'Sylvie', 'Hortense', 'Denise', 'Google français'];
      frVoice = pref.map(n => fr.find(v => v.name.includes(n))).find(Boolean)
        || fr.find(v => /fr-CA/i.test(v.lang)) || fr[0] || null;
    } catch (e) { frVoice = null; }
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) { speechSynthesis.onvoiceschanged = pickVoice; }
  }
  // iOS only lets a page speak once speech has been started from a tap: do it silently on the first tap.
  let speechUnlocked = false, utt = null;
  function unlockSpeech() {
    if (speechUnlocked || !('speechSynthesis' in window)) return;
    speechUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; utt = u; speechSynthesis.speak(u); } catch (e) {}
  }
  function say(text, then) {
    let done = false;
    const fin = () => { if (!done) { done = true; if (then) then(); } };
    if (S.sound === false || !('speechSynthesis' in window)) { fin(); return; }
    try {
      if (!frVoice) pickVoice();
      try { speechSynthesis.resume(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(text);
      utt = u; // keep a reference so Safari doesn't drop it mid-sentence
      if (frVoice) { u.voice = frVoice; u.lang = frVoice.lang; } else u.lang = 'fr-CA';
      u.rate = 1; u.pitch = 1.1;
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 5000);
      speechSynthesis.speak(u);
    } catch (e) { fin(); }
  }

  function flash(kind, title, text) {
    msg = { kind, title, text };
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msg = null; render(); }, 3500);
  }

  function startGame(n) {
    Object.assign(S, E.createGame(S.names.slice(0, n)));
    S.screen = 'game';
    msg = null; sheet = null;
  }
  // A game that is in progress and could still be resumed from the setup screen.
  const resumable = () => S.players.length > 0 && S.winner === null;

  // Plays the sounds and the voice for a scored turn, in order:
  // victory -> fanfare (just reached 3 500) -> voice (1 500 or less left) -> steal sound for the next team.
  function playScored(ev) {
    const rem = TARGET - ev.after;
    const steps = [];
    if (ev.won) {
      steps.push(done => { victory(); setTimeout(done, 1700); });
      steps.push(done => say(`${S.names[ev.player]} gagne avec ${fmt(TARGET)} points!`, done));
    } else {
      if (ev.before < MIN_VOL && ev.after >= MIN_VOL) steps.push(done => { fanfare(); setTimeout(done, 1100); });
      if (rem <= SAY_REMAINING) steps.push(done => say(`${S.names[ev.player]}, il reste ${rem} points.`, done));
      const fx = volAlert();
      if (fx) steps.push(done => { fx(); done(); });
    }
    (function run() { const st = steps.shift(); if (st) st(run); })();
  }

  // ---- Actions -----------------------------------------------------------
  const GAME_ACTIONS = { add: 1, vol: 1, clear: 1, pass: 1, submit: 1, undo: 1, redo: 1 };

  function act(a, v) {
    let moved = false;
    pulseVol = false;

    if (GAME_ACTIONS[a]) {
      const r = E.reduce(S, { type: a, v: v === undefined ? undefined : +v });
      if (r.error) {
        flash(r.error.kind, r.error.title, r.error.text);
      } else {
        Object.assign(S, r.state);
        const ev = (r.events || [])[0];
        if (ev) {
          moved = true; msg = null;
          if (ev.type === 'scored') playScored(ev);
        }
      }
    } else {
      switch (a) {
        case 'sound':
          S.sound = S.sound === false;
          if (S.sound) say('Son activé', siren);
          break;
        case 'count': S.count = +v; break;
        case 'start':
          if (resumable() && !confirmStart) {
            confirmStart = true; clearTimeout(confirmTimer);
            confirmTimer = setTimeout(() => { confirmStart = false; render(); }, 3000);
            break;
          }
          confirmStart = false;
          S.names = Array.from({ length: S.count }, (_, i) => S.names[i] || `Joueur ${i + 1}`);
          startGame(S.count); break;
        case 'resume':
          confirmStart = false; S.screen = 'game'; msg = null; sheet = null; break;
        case 'replay': startGame(S.players.length || S.count); break;
        case 'log': sheet = 'log'; break;
        case 'closelog': sheet = null; break;
        case 'new':
          if (S.winner !== null || confirmNew) {
            confirmNew = false; S.count = S.players.length || S.count; S.screen = 'setup'; msg = null; sheet = null;
          } else {
            confirmNew = true; clearTimeout(confirmTimer);
            confirmTimer = setTimeout(() => { confirmNew = false; render(); }, 3000);
          }
          break;
      }
    }

    save(); render();
    if (moved) scrollToActive();
  }

  // ---- Rendering ---------------------------------------------------------
  const ICON = {
    undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
    redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>',
    sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
  };

  function viewSetup() {
    const counts = [2, 3, 4, 5, 6].map(n =>
      `<button data-a="count" data-v="${n}" aria-pressed="${S.count === n}">${n}</button>`).join('');
    const resume = resumable();
    const lead = S.players.slice(0, 4).map((p, i) =>
      `${esc(S.names[i] || 'Joueur ' + (i + 1))} ${fmt(p.score)}`).join(' · ');
    return `<div class="app"><div class="setup">
      <h1>20K <span>Scorecard</span></h1>
      ${resume ? `<button class="resume" data-a="resume">
        <span class="rt"><b>Reprendre la partie en cours</b>
        <small>${lead}${S.players.length > 4 ? ' …' : ''}</small></span>${ICON.chev}
      </button>` : ''}
      <div><h2>Nombre de joueurs</h2><div class="count">${counts}</div></div>
      <ul class="rules">
        <li>Premier score : <b>${fmt(MIN_OPEN)}</b> minimum</li>
        <li>Vol permis à partir de <b>${fmt(MIN_VOL)}</b></li>
        <li>Objectif exact : <b>${fmt(TARGET)}</b></li>
      </ul>
      <button class="go${confirmStart ? ' danger' : ''}" data-a="start">${confirmStart ? 'Remplacer la partie en cours ?' : resume ? 'Nouvelle partie' : 'Commencer le jeu'}</button>
      <p class="version">Version ${VERSION}</p>
    </div></div>`;
  }

  function viewRow(p, i) {
    const active = i === S.current && S.winner === null;
    const won = i === S.winner;
    return `<section class="row${active ? ' active' : ''}${won ? ' won' : ''}" id="row-${i}">
      <div class="who">
        <div class="namewrap"><span class="dot"></span>
          <input class="name" id="name-${i}" data-name="${i}" value="${esc(S.names[i])}" aria-label="Nom du joueur ${i + 1}" autocomplete="off"></div>
        <div class="meta">
          ${p.last !== null ? `<span class="last">Dernier : +${fmt(p.last)}</span>` : ''}
          ${!p.started ? `<span class="hint">Minimum ${fmt(MIN_OPEN)} pour commencer</span>` : ''}
        </div>
      </div>
      <div class="nums">
        <div class="num"><small>Points</small><b>${fmt(p.score)}</b></div>
        <div class="num rem"><small>Restant</small><b>${won ? 'Gagnant!' : fmt(TARGET - p.score)}</b></div>
      </div>
    </section>`;
  }

  function viewPanel() {
    const t = S.turn, total = t.stolen + t.add, vol = E.canVol(S);
    const p = S.players[S.current];
    const volTitle = E.volReason(S);
    const turnHtml = t.stolen
      ? `<span class="stolen">${ICON.lock}<small>VOL</small>${fmt(t.stolen)}</span>
         <span class="plus${t.add ? '' : ' zero'}">+ ${fmt(t.add)}</span>`
      : `<span class="base">${fmt(t.add)}</span>`;
    const clearLabel = t.add ? 'Effacer' : t.stolen ? 'Annuler le vol' : '';
    const left = TARGET - p.score, maxAdd = Math.max(0, left - t.stolen);
    return `<footer class="panel" id="panel">
      ${msg ? `<div class="msg ${msg.kind}" role="alert">${ICON.info}<div><strong>${msg.title}</strong>${esc(msg.text)}</div></div>` : ''}
      <div class="turnline">
        <div>
          <div class="label">Tour actuel · <b>${esc(S.names[S.current])}</b></div>
          <div class="turn">${turnHtml}</div>
          <div class="total">${t.stolen
            ? `Total <b>${fmt(total)}</b> · reste <b>${fmt(left)}</b> · max +<b>${fmt(maxAdd)}</b>`
            : `Reste <b>${fmt(left)}</b>`}</div>
        </div>
        ${clearLabel ? `<button class="clear" data-a="clear">${clearLabel}</button>` : ''}
      </div>
      <div class="keys">
        ${STEPS.map(n => `<button class="key" data-a="add" data-v="${n}">+${n}</button>`).join('')}
        <button class="key vol${pulseVol && vol ? ' pulse' : ''}" data-a="vol" ${vol ? '' : 'disabled'} title="${volTitle}" aria-label="Vol : ${volTitle}">VOL</button>
      </div>
      ${vol ? '' : `<p class="volhint">${ICON.lock}<span>${volTitle}</span></p>`}
      <div class="actions">
        <button class="act pass" data-a="pass">Aucun point</button>
        <button class="act ok" data-a="submit" ${total ? '' : 'disabled'}>Ajouter au score</button>
      </div>
    </footer>`;
  }

  function viewGame() {
    const w = S.winner;
    return `<div class="app">
      <header class="top">
        <h1>20K <span>Scorecard</span></h1>
        <div class="tools">
          <button class="tool icon undo" data-a="undo" aria-label="Annuler le dernier tour" title="Annuler" ${S.past.length ? '' : 'disabled'}>${ICON.undo}</button>
          <button class="tool icon redo" data-a="redo" aria-label="Refaire le tour annulé" title="Refaire" ${S.future.length ? '' : 'disabled'}>${ICON.redo}</button>
          <button class="tool icon" data-a="log" aria-label="Historique des tours" title="Historique">${ICON.log}</button>
          <button class="tool sound" data-a="sound" aria-label="${S.sound === false ? 'Activer le son' : 'Couper le son'}" title="${S.sound === false ? 'Son coupé' : 'Son activé'}">${S.sound === false ? ICON.mute : ICON.sound}</button>
          <button class="tool${confirmNew ? ' danger' : ''}" data-a="new">${confirmNew ? 'Confirmer ?' : 'Nouveau<span class="nj"> jeu</span>'}</button>
        </div>
      </header>
      ${w !== null ? `<div class="win">
        <h2>🏆 ${esc(S.names[w])} gagne avec ${fmt(S.players[w].score)} points!</h2>
        <div class="btns">
          <button class="replay" data-a="replay">Rejouer avec les mêmes joueurs</button>
          <button class="fresh" data-a="new">Nouveau jeu</button>
        </div></div>` : ''}
      <main class="list">${S.players.map(viewRow).join('')}</main>
      ${w === null ? viewPanel() : ''}
    </div>`;
  }

  function viewSheet() {
    const rows = S.log.slice().reverse();
    const body = rows.length ? rows.map(e => {
      const nm = esc(S.names[e.i] || `Joueur ${e.i + 1}`);
      const v = e.pass ? 'Aucun point'
        : e.stolen ? `Vol ${fmt(e.stolen)} + ${fmt(e.add)}`
        : `+${fmt(e.add)}`;
      const cls = e.pass ? ' none' : e.stolen ? ' vol' : '';
      return `<div class="logrow"><span class="ln">${e.n}</span><span class="lnm">${nm}</span>
        <span class="lv${cls}">${v}</span><span class="ls">${fmt(e.after)}</span></div>`;
    }).join('') : '<p class="empty">Aucun tour joué pour le moment.</p>';
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Historique des tours">
      <header class="sheet-top"><h2>Historique</h2>
        <button class="tool icon" data-a="closelog" aria-label="Fermer l'historique">${ICON.close}</button></header>
      <div class="sheet-body">
        ${rows.length ? '<div class="loghead"><span>#</span><span>Joueur</span><span>Tour</span><span>Total</span></div>' : ''}
        ${body}
      </div>
    </div>`;
  }

  const root = document.getElementById('root');
  function render() {
    root.innerHTML = (S.screen === 'setup' ? viewSetup() : viewGame()) + (sheet ? viewSheet() : '');
    const panel = document.getElementById('panel');
    document.documentElement.style.setProperty('--panel-h', (panel ? panel.offsetHeight : 0) + 'px');
  }
  function scrollToActive() {
    const el = document.getElementById('row-' + S.current);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (S.sound !== false) { audio(); unlockSpeech(); }
    if (b && !b.disabled) act(b.dataset.a, b.dataset.v);
  });
  document.addEventListener('input', e => {
    const i = e.target.dataset && e.target.dataset.name;
    if (i !== undefined) {
      Object.assign(S, E.reduce(S, { type: 'rename', i: +i, name: e.target.value }).state);
      save();
    }
  });
  document.addEventListener('change', e => {
    const i = e.target.dataset && e.target.dataset.name;
    if (i !== undefined && !e.target.value.trim()) {
      Object.assign(S, E.reduce(S, { type: 'rename', i: +i, name: `Joueur ${+i + 1}` }).state);
      save(); render();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheet) { sheet = null; render(); }
  });
  window.addEventListener('resize', () => {
    const panel = document.getElementById('panel');
    if (panel) document.documentElement.style.setProperty('--panel-h', panel.offsetHeight + 'px');
  });

  // Keep the screen on while a game is open (ignored where unsupported).
  let wake = null;
  async function keepAwake() {
    try {
      if (S.screen === 'game' && 'wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { wake = null; }
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', keepAwake);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  render();
  keepAwake();
})();

</script>
</body>
