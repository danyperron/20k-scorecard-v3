<!doctype html><!-- Généré par 20k-app/build.js : modifier src/, pas ce fichier. -->
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="20K">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>20K Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Layout: scorecard list that scrolls, turn panel pinned to the bottom of the screen */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f2f4f8; --line:#dce1e9;
  --fg:#18202c; --muted:#5d6878; --on-strong:#ffffff; --shadow:rgba(20,30,50,.10);
  --accent:#1f5fd6; --accent-soft:#e4ecfc;
  --good:#16833c; --good-soft:#e2f4e8;
  --bad:#c9302c; --bad-soft:#fbe8e7;
  --warn:#d06d10; --warn-soft:#fdf0e1;
  --purple:#7a3fc4; --key:#2a3341;
  --pass:#5b6b8c; --pass-soft:#e7ecf5;
  --gold:#a56600; --gold-2:#b4500f;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --surface-2:#1e2632; --line:#2c3644;
  --fg:#e8edf4; --muted:#9aa6b6; --shadow:rgba(0,0,0,.45);
  --accent:#6f9dff; --accent-soft:#1b2a45; --good:#3fb96c; --good-soft:#15301f;
  --bad:#e9554e; --bad-soft:#3a1a19; --warn:#e48d33; --warn-soft:#3a2813;
  --purple:#b892ff; --key:#35404f;
  --pass:#8b9cc2; --pass-soft:#232c3a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface-2:#1e2632; --line:#2c3644;
  --fg:#e8edf4; --muted:#9aa6b6; --shadow:rgba(0,0,0,.45);
  --accent:#6f9dff; --accent-soft:#1b2a45; --good:#3fb96c; --good-soft:#15301f;
  --bad:#e9554e; --bad-soft:#3a1a19; --warn:#e48d33; --warn-soft:#3a2813;
  --purple:#b892ff; --key:#35404f;
  --pass:#8b9cc2; --pass-soft:#232c3a; color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:var(--ui)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed}

.app{max-width:760px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

/* Header */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:14px 12px}
h1{font:700 26px/1 var(--num);margin:0;letter-spacing:.01em}
h1 span{color:var(--muted);font-weight:600}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tool svg{width:16px;height:16px}
.tool.undo:not(:disabled){background:var(--warn);border-color:transparent;color:var(--on-strong)}
.tool.redo:not(:disabled){background:var(--good);border-color:transparent;color:var(--on-strong)}
.tool:disabled{opacity:.45}
.tool.danger{background:var(--bad);border-color:transparent;color:var(--on-strong)}

/* Winner */
.win{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--on-strong);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:10px;text-align:center}
.win h2{margin:0;font:700 24px/1.15 var(--num);text-wrap:balance}
.win .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.win button{height:46px;padding:0 16px;border-radius:12px;border:0;font-weight:700;font-size:15px}
.win .replay{background:var(--on-strong);color:var(--gold-2)}
.win .fresh{background:rgba(0,0,0,.28);color:var(--on-strong)}

/* Score rows */
.list{flex:1;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;
  scroll-margin-bottom:calc(var(--panel-h,280px) + 12px);scroll-margin-top:12px}
.row.active{border:2px solid var(--accent);background:var(--accent-soft);padding:9px 13px}
.who{flex:1;min-width:0}
.namewrap{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;visibility:hidden}
.row.active .dot{visibility:visible;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.name{font:600 17px var(--ui);color:var(--fg);background:transparent;border:0;border-bottom:1px dashed transparent;
  width:100%;min-width:0;padding:2px 0;border-radius:0}
.name:focus{outline:none;border-bottom-color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;margin-top:2px;padding-left:18px}
.last{color:var(--purple);font-weight:600}
.hint{color:var(--muted)}
.nums{display:flex;gap:16px;text-align:right;flex:none}
.num small{display:block;font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num b{display:block;font:700 26px/1.1 var(--num);font-variant-numeric:tabular-nums;min-width:4.4ch}
.num.rem b{color:var(--accent)}
.row.won .num b{color:var(--good)}

/* Turn panel (pinned) */
.panel{position:sticky;bottom:0;margin-inline:-16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 24px var(--shadow)}
.msg{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1.5px solid;font-size:14px;line-height:1.35}
.msg strong{display:block;font-size:15px}
.msg svg{flex:none;width:20px;height:20px;margin-top:1px}
.msg.bad{background:var(--bad-soft);border-color:var(--bad)} .msg.bad svg{color:var(--bad)}
.msg.warn{background:var(--warn-soft);border-color:var(--warn)} .msg.warn svg{color:var(--warn)}
.turnline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.turnline > div{min-width:0}
.label{font-size:13px;color:var(--muted);margin-bottom:2px}
.label b{color:var(--fg)}
.turn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 34px/1.15 var(--num);font-variant-numeric:tabular-nums}
.base{color:var(--accent)}
.stolen{display:inline-flex;align-items:center;gap:7px;color:var(--fg);background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:10px;padding:0 10px}
.stolen small{font:700 11px var(--ui);letter-spacing:.1em;color:var(--accent)}
.stolen svg{width:14px;height:14px;color:var(--accent)}
.plus{color:var(--good)}
.plus.zero{color:var(--muted);opacity:.6}
.total{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.total b{color:var(--fg);font:700 16px var(--num);font-variant-numeric:tabular-nums}
.clear{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:600;font-size:14px;flex:none}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.key{height:52px;border-radius:12px;border:0;background:var(--key);color:var(--on-strong);font:700 17px var(--num);font-variant-numeric:tabular-nums;transition:transform .08s}
.key:active:not(:disabled){transform:scale(.95)}
.key.vol{background:var(--accent);letter-spacing:.06em}
.key.vol.pulse{animation:volpulse .5s ease-in-out 4}
@keyframes volpulse{50%{transform:scale(1.08);box-shadow:0 0 0 4px var(--accent-soft)}}
.tool.sound{padding:0 10px}
.tool.sound svg{width:18px;height:18px}
.tool.icon{width:38px;padding:0;justify-content:center}
.tool.icon svg{width:18px;height:18px}
.volhint{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:13px;line-height:1.3;color:var(--muted)}
.volhint svg{flex:none;width:14px;height:14px;color:var(--warn)}
.key.vol:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{height:54px;border-radius:12px;border:0;font-weight:700;font-size:17px;color:var(--on-strong)}
.pass{background:var(--bad)}
.ok{background:var(--good)}
.ok:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
/* « Passer à <joueur> » : vert réservé aux points, donc gris ardoise/bleu acier. */
.act.slate{background:var(--pass);box-shadow:0 2px 0 var(--shadow)}
.act.slate:active:not(:disabled){transform:scale(.98)}
.act.purple{background:var(--purple);box-shadow:0 2px 0 var(--shadow)}
.act.purple:active:not(:disabled){transform:scale(.98)}
.act.purple:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ---- Mode dés ---- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.mode{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:700;font-size:15px}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.dice-wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.reroll{height:46px;padding:0 16px;border-radius:12px;border:0;background:var(--warn);color:var(--on-strong);font-weight:700;font-size:16px;flex:none;box-shadow:0 2px 0 var(--shadow);transition:transform .08s}
.reroll:active:not(:disabled){transform:scale(.95)}
.reroll:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.reroll.vol{background:var(--purple)}
.topctr{display:flex;align-items:center;gap:8px;flex:none}
.diceleft{height:46px;padding:0 12px;border-radius:12px;background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent);
  font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;white-space:nowrap}
.dstate{font-size:13px;color:var(--muted);line-height:1.4}
.dstate b{color:var(--fg)}
.dturn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dturn .dlab{font:700 12px var(--ui);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.dturn .damt{font:700 30px var(--num);font-variant-numeric:tabular-nums;color:var(--accent)}
.dturn .dgain{font:700 15px var(--num);color:var(--good);font-variant-numeric:tabular-nums}
.dboard{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:10px}
.die{position:relative;aspect-ratio:1;border-radius:11px;background:var(--on-strong);color:var(--fg);
  border:1.5px solid var(--line);box-shadow:0 2px 0 var(--shadow);
  transition:transform .12s,box-shadow .12s;min-width:44px;min-height:44px}
.die:not(.gray):not(.dead){border-color:var(--line)}
.die.kept{background:var(--surface);
  border-color:var(--pip,var(--accent));
  border-color:color-mix(in srgb,var(--pip,var(--accent)) 42%,var(--line))}
.die.gray,.die.dead{background:var(--surface-2);color:var(--muted);opacity:.85;border-style:dashed;border-color:var(--line)}
.die .face{position:absolute;inset:10%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:9%}
.die .pip{border-radius:50%;background:var(--pip,var(--accent));justify-self:center;align-self:center;width:96%;aspect-ratio:1}
.die .pip.off{background:transparent}
.die.gray .pip:not(.off),.die.dead .pip:not(.off){background:var(--muted)}
.die.rollin{overflow:hidden}
.dhint{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.35}
.drow-lost .num b{color:var(--bad)}
.dmsgs{margin-bottom:8px}
.dmsg{border-radius:10px;padding:9px 11px;border:1.5px solid;font-size:13px;line-height:1.35;margin-bottom:6px}
.dmsg.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dmsg.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.dmsg.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dsub{font-size:13px;color:var(--muted);margin:0 0 8px;line-height:1.45}
.dsub b{color:var(--fg)}
.dgrid{display:block;margin-bottom:6px}
.dgrid .die{min-width:44px;min-height:44px}
.dgrid small{display:block;font:700 12px var(--num);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.dgrid .dgroup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.dgrid .div{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dgrid .div .die{flex:1 1 24%;min-width:52px;max-width:60px}
.des-log{margin-top:6px}
.des-log summary{font-weight:600;font-size:14px;cursor:pointer;color:var(--accent);padding:4px 0}
.dlogrow{display:grid;grid-template-columns:2em 1fr auto 4.2em;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.dlogrow .ln{font:600 12px var(--num);color:var(--muted)}
.dlogrow .lnm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlogrow .lv{text-align:right;font-weight:600;color:var(--good);white-space:nowrap}
.dlogrow .lv.vol{color:var(--purple)}
.dlogrow .lv.none{color:var(--muted);font-weight:500}
.dlogrow .ls{text-align:right;font:700 15px var(--num);font-variant-numeric:tabular-nums}
.dloghead{font-size:12px;color:var(--muted);margin:4px 0 8px;letter-spacing:.02em}
.djetrow{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto auto 3.4em;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.djetrow .ln{font:600 12px var(--num);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.djetrow .lnm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.djetrow .ddice-mini{font:700 15px var(--num);letter-spacing:.06em;color:var(--fg);white-space:nowrap}
.djetrow .lv{text-align:right;font-weight:600;color:var(--good);white-space:nowrap}
.djetrow .lv.vol{color:var(--purple)}
.djetrow .lv.none{color:var(--bad);font-weight:600}
.djetrow .lv.lv{color:var(--fg)}
.djetrow .ls{text-align:right;font:700 15px var(--num);font-variant-numeric:tabular-nums;color:var(--accent)}
.dvn{display:flex;align-items:baseline;gap:6px}
.dvn b{font:700 18px var(--num);color:var(--accent)}
.dvn span{font-size:13px;color:var(--muted)}

/* Setup */
.setup{margin:auto;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;
  display:flex;flex-direction:column;gap:20px;margin-block:24px}
.setup h1{font-size:34px;text-align:center}
.setup h2{font-size:15px;margin:0 0 10px;font-weight:600}
.count{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.count button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:700 20px var(--num)}
.count button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-strong)}
.rules{margin:0;padding:12px 14px;background:var(--surface-2);border-radius:12px;font-size:14px;line-height:1.6;color:var(--muted);list-style:none}
.rules b{color:var(--fg);font-family:var(--num);font-variant-numeric:tabular-nums}
.version{margin:-8px 0 0;text-align:center;font-size:12px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.go{height:56px;border-radius:14px;border:0;background:var(--good);color:var(--on-strong);font-weight:700;font-size:18px}
.go.danger{background:var(--bad)}
.go:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);cursor:not-allowed}
.setup h2 .cnt{display:inline-block;min-width:22px;text-align:center;background:var(--accent);color:var(--on-strong);
  border-radius:10px;padding:1px 7px;font:700 12px var(--num);vertical-align:middle}
.pchips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pchip{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);
  border-radius:12px;padding:8px 10px;color:var(--fg);font-weight:600;font-size:14px;min-width:0}
.pchip.on{background:var(--accent-soft);border-color:var(--accent)}
.pchip .pnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .pstat{font:600 11px var(--num);color:var(--muted);white-space:nowrap}
.pchip.on .pstat{color:var(--accent)}
.avat{width:30px;height:30px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;
  font:700 15px var(--num);flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0;text-decoration:underline;cursor:pointer}
.roster-empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--muted);font-size:14px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.prow .pinfo{flex:1;min-width:0}
.prow .pinfo b{display:block;font-size:15px}
.prow .pinfo small{color:var(--muted);font-size:12px}
.prow .pops{display:flex;gap:6px;align-items:center}
.prow .trophy{font-size:15px}
.mini{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);
  font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.mini.danger{color:var(--bad)}
.plist{margin:4px 0}
.peditor{border:1px dashed var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--accent-soft)}
.peditor input{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  font-size:16px;padding:0 12px;width:100%}
.pcolors{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none}
.sw.on{outline:3px solid var(--fg);outline-offset:2px}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);
  border:1.5px solid var(--accent);border-radius:14px;padding:12px 14px;color:var(--fg);
  transition:transform .08s}
.resume:active{transform:scale(.985)}
.resume .rt{flex:1;min-width:0}
.resume b{display:block;font-size:15px;color:var(--accent)}
.resume small{display:block;margin-top:2px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume svg{flex:none;width:18px;height:18px;color:var(--accent)}
.resume.des{background:var(--good-soft);border-color:var(--good)}
.resume.des b{color:var(--good)}
.resume.des svg{color:var(--good)}
.resume .rt2{flex:none;font-size:20px}
.past{margin-top:2px}
.past h2{font-size:15px;margin:0 0 10px;font-weight:600}
.pastrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);margin-bottom:8px;transition:transform .08s}
.pastrow:active{transform:scale(.985)}
.pastrow .rt{flex:1;min-width:0}
.pastrow b{display:block;font-size:15px;color:var(--good)}
.pastrow small{display:block;margin-top:2px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pastrow svg{flex:none;width:18px;height:18px;color:var(--muted)}

/* Journal des tours */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;overscroll-behavior:contain}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-top h2{margin:0;font:700 20px var(--num)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.loghead,.logrow{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto 4.2em;gap:8px;align-items:baseline}
.loghead{padding:10px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.loghead span:nth-child(3),.loghead span:nth-child(4){text-align:right}
.logrow{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.logrow .ln{font:600 12px var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.logrow .lnm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow .lv{text-align:right;font-weight:600;color:var(--good);white-space:nowrap}
.logrow .lv.vol{color:var(--purple)}
.logrow .lv.none{color:var(--muted);font-weight:500}
.logrow .ls{text-align:right;font:700 15px var(--num);font-variant-numeric:tabular-nums}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

@media (max-width:400px){
  .num b{font-size:22px} .nums{gap:12px} .key{font-size:15px;height:50px} .turn{font-size:30px}
  .tool{padding:0 10px}
}
@media (max-width:380px){.nj{display:none} .nums{gap:10px}}
@media (prefers-reduced-motion:reduce){.key.vol.pulse{animation:none}.row.active .dot{animation:none}.key{transition:none}}
