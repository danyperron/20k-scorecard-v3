<script>
/* 20K — moteur de règles.
 *
 * Pur : aucune dépendance au DOM, au stockage, au son ou au réseau.
 * Utilisé tel quel par l'interface web, et plus tard par le serveur du mode
 * « salon » (chaque appareil envoie des actions, tout le monde rejoue avec ce
 * même fichier : impossible de diverger).
 *
 * État du jeu :
 *   {
 *     names:   ["Marie", ...],
 *     players: [{ score, last, started }, ...],
 *     current: 2,                      // index du joueur dont c'est le tour
 *     prevTurn:{ player, points } | null,  // dernier tour qui a marqué (source du vol)
 *     winner:  1 | null,
 *     turn:    { stolen, add },        // saisie en cours
 *     log:     [{ i, n, add, stolen, total, after, pass }, ...],
 *     past:    [snapshot, ...],        // annulation
 *     future:  [snapshot, ...]         // rétablissement
 *   }
 *
 * reduce(état, action) renvoie { state, error?, events? } et ne modifie jamais
 * l'état reçu.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var TARGET = 20000, MIN_OPEN = 1000, MIN_VOL = 3500;
  var SAY_REMAINING = 1500;  // la voix annonce le reste à 1 500 ou moins
  var VOL_SOUND_MIN = 1000;  // sirène seulement pour un vol de 1 000 et plus
  var STEPS = [50, 100, 200, 500, 1000];
  var HISTORY_MAX = 300;

  var fmt = function (n) { return Number(n).toLocaleString('fr-CA'); };
  var freshTurn = function () { return { stolen: 0, add: 0 }; };

  function createGame(names) {
    names = (names || []).map(function (n) { return String(n); });
    return {
      names: names,
      players: names.map(function () { return { score: 0, last: null, started: false }; }),
      current: 0, prevTurn: null, winner: null,
      turn: freshTurn(), log: [], past: [], future: []
    };
  }

  function nextIdx(s, i) { return (i + 1) % s.players.length; }

  // Le vol ne vise que le tour qui vient de se terminer, et il faut encore de la
  // place pour les points volés plus les 50 obligatoires.
  function volFits(s) {
    return !!s.prevTurn &&
      s.players[s.current].score + s.prevTurn.points + STEPS[0] <= TARGET;
  }

  function canVol(s) {
    var p = s.players[s.current], t = s.prevTurn;
    return s.winner === null && !s.turn.stolen && p.score >= MIN_VOL &&
      !!t && t.points > 0 && t.player !== s.current && volFits(s);
  }

  // Raison lisible de l'état du bouton VOL (affichée sous les touches).
  function volReason(s) {
    var p = s.players[s.current], t = s.turn;
    if (p.score < MIN_VOL) return 'Nécessite ' + fmt(MIN_VOL) + ' points minimum';
    if (t.stolen) return 'Vol déjà fait ce tour';
    if (canVol(s)) return 'Voler le dernier score';
    if (s.prevTurn && s.prevTurn.points > 0 && !volFits(s)) return 'Pas assez de points restants pour ce vol';
    return 'Aucun score à voler';
  }

  // État destiné au réseau (snapshot diffusé) : aucun historique d'annulation.
  // On garde names, log et le dernier état, jamais past/future, pour que chaque
  // appareil voit exactement la même partie sans l'encombrer des états internes.
  function serializePublic(s) {
    return {
      names: s.names.slice(),
      players: s.players.map(function (p) {
        return { score: p.score, last: p.last, started: p.started };
      }),
      current: s.current,
      prevTurn: s.prevTurn ? { player: s.prevTurn.player, points: s.prevTurn.points } : null,
      winner: s.winner,
      turn: { stolen: s.turn.stolen, add: s.turn.add },
      log: s.log.map(function (e) { return Object.assign({}, e); })
    };
  }

  // ---- Copies -------------------------------------------------------------
  function clone(s) {
    return {
      names: s.names.slice(),
      players: s.players.map(function (p) {
        return { score: p.score, last: p.last, started: p.started };
      }),
      current: s.current,
      prevTurn: s.prevTurn ? { player: s.prevTurn.player, points: s.prevTurn.points } : null,
      winner: s.winner,
      turn: { stolen: s.turn.stolen, add: s.turn.add },
      log: s.log.map(function (e) { return Object.assign({}, e); }),
      past: s.past.slice(),
      future: s.future.slice()
    };
  }

  // Les noms sont volontairement hors de l'historique : renommer ne s'annule pas.
  function snapshot(s) {
    return JSON.parse(JSON.stringify({
      players: s.players, current: s.current, prevTurn: s.prevTurn,
      winner: s.winner, turn: s.turn, log: s.log
    }));
  }

  function applySnapshot(s, x) {
    s.players = x.players.map(function (p) {
      return { score: p.score, last: p.last, started: p.started };
    });
    s.current = x.current;
    s.prevTurn = x.prevTurn ? { player: x.prevTurn.player, points: x.prevTurn.points } : null;
    s.winner = typeof x.winner === 'number' ? x.winner : null;
    s.turn = x.turn ? { stolen: x.turn.stolen, add: x.turn.add } : freshTurn();
    s.log = Array.isArray(x.log) ? x.log.map(function (e) { return Object.assign({}, e); }) : [];
  }

  function commit(s) {
    s.past.push(snapshot(s));
    if (s.past.length > HISTORY_MAX) s.past.shift();
    s.future = [];
  }

  // ---- Actions ------------------------------------------------------------
  function reduce(state, action) {
    var s = clone(state);
    var a = action || {};
    switch (a.type) {
      case 'add': {
        var v = Number(a.v);
        if (!isFinite(v) || v === 0) return { state: s };
        s.turn.add += v;
        return { state: s };
      }

      case 'vol':
        if (!canVol(s)) return { state: s };
        s.turn.stolen = s.prevTurn.points;
        return { state: s };

      case 'clear':
        if (s.turn.add) s.turn.add = 0; else s.turn.stolen = 0;
        return { state: s };

      case 'pass': {
        commit(s);
        var i = s.current;
        s.log.push({ i: i, n: s.log.length + 1, add: 0, stolen: 0, total: 0,
                     after: s.players[i].score, pass: true });
        s.prevTurn = null;
        s.current = nextIdx(s, i);
        s.turn = freshTurn();
        return { state: s, events: [{ type: 'passed', player: i }] };
      }

      case 'submit': {
        var j = s.current, p = s.players[j], t = s.turn;
        var total = t.stolen + t.add;
        if (!total) return { state: s };
        if (t.stolen && t.add === 0) {
          return { state: s, error: { kind: 'warn', title: 'Score invalide après un vol',
            text: 'Le score ne peut pas être identique au score volé.' } };
        }
        if (!p.started && total < MIN_OPEN) {
          return { state: s, error: { kind: 'bad', title: 'Score minimum requis',
            text: 'Le premier score doit être d\'au moins ' + fmt(MIN_OPEN) + ' points pour commencer à jouer.' } };
        }
        if (p.score + total > TARGET) {
          return { state: s, error: { kind: 'bad', title: 'Score trop élevé',
            text: 'Vous ne pouvez pas dépasser ' + fmt(TARGET) + ' points. Il reste ' +
                  fmt(TARGET - p.score) + ' points à ' + s.names[j] + '.' } };
        }
        commit(s);
        var before = p.score;
        p.score += total; p.last = total; p.started = true;
        s.log.push({ i: j, n: s.log.length + 1, add: t.add, stolen: t.stolen,
                     total: total, after: p.score, pass: false });
        s.prevTurn = { player: j, points: total };
        if (p.score === TARGET) s.winner = j; else s.current = nextIdx(s, j);
        s.turn = freshTurn();
        return { state: s, events: [{ type: 'scored', player: j, before: before, after: p.score,
          total: total, stolen: t.stolen, add: t.add, won: p.score === TARGET }] };
      }

      case 'undo':
        if (!s.past.length) return { state: s };
        s.future.push(snapshot(s));
        applySnapshot(s, s.past.pop());
        return { state: s, events: [{ type: 'undone' }] };

      case 'redo':
        if (!s.future.length) return { state: s };
        s.past.push(snapshot(s));
        applySnapshot(s, s.future.pop());
        return { state: s, events: [{ type: 'redone' }] };

      case 'rename': {
        var k = Number(a.i);
        if (!(k >= 0 && k < s.names.length)) return { state: s };
        s.names[k] = String(a.name == null ? '' : a.name);
        return { state: s };
      }

      default:
        return { state: s };
    }
  }

  // ---- Sauvegardes anciennes ou partielles --------------------------------
  function normalize(raw) {
    if (!raw || !Array.isArray(raw.players)) return null;
    var names = Array.isArray(raw.names) ? raw.names.slice() : [];
    var players = raw.players.map(function (p) {
      if (!p || typeof p.score !== 'number') return { score: 0, last: null, started: false };
      return { score: p.score,
               last: typeof p.last === 'number' ? p.last : null,
               started: typeof p.started === 'boolean' ? p.started : p.score > 0 };
    });
    players.forEach(function (p, i) {
      if (typeof names[i] !== 'string' || !names[i].trim()) names[i] = 'Joueur ' + (i + 1);
    });
    var isNum = function (v) { return typeof v === 'number' && isFinite(v); };
    var current = isNum(raw.current) ? raw.current : 0;
    if (current < 0 || current >= players.length) current = 0;
    var turn = (raw.turn && isNum(raw.turn.add) && isNum(raw.turn.stolen))
      ? { stolen: raw.turn.stolen, add: raw.turn.add } : freshTurn();
    var prevTurn = (raw.prevTurn && isNum(raw.prevTurn.player) && isNum(raw.prevTurn.points))
      ? { player: raw.prevTurn.player, points: raw.prevTurn.points } : null;
    var winner = isNum(raw.winner) && raw.winner >= 0 && raw.winner < players.length ? raw.winner : null;
    return {
      names: names, players: players, current: current,
      prevTurn: prevTurn, winner: winner, turn: turn,
      log: Array.isArray(raw.log) ? raw.log.filter(function (e) { return e && isNum(e.n); }) : [],
      past: Array.isArray(raw.past) ? raw.past.filter(function (x) { return x && Array.isArray(x.players); }) : [],
      future: Array.isArray(raw.future) ? raw.future.filter(function (x) { return x && Array.isArray(x.players); }) : []
    };
  }

  return {
    TARGET: TARGET, MIN_OPEN: MIN_OPEN, MIN_VOL: MIN_VOL,
    SAY_REMAINING: SAY_REMAINING, VOL_SOUND_MIN: VOL_SOUND_MIN,
    STEPS: STEPS, HISTORY_MAX: HISTORY_MAX,
    fmt: fmt, freshTurn: freshTurn,
    createGame: createGame, reduce: reduce, normalize: normalize,
    serializePublic: serializePublic,
    canVol: canVol, volFits: volFits, volReason: volReason
  };
});

</script>
<script>
/* 20K — moteur des DÉS (6 dés).
 *
 * Pur : aucune dépendance au DOM, au stockage, au son ou au réseau.
 * Règles issues de SPEC-des.md (dictées par l'auteur, verrouillées 2026-11-21).
 *
 * La règle la plus importante : les combinaisons ne se forment que DANS UN MÊME
 * lancer. Les dés gardés d'un lancer antérieur gardent leur valeur unitaire,
 * ils ne se recombinent jamais avec les nouveaux. Le tour cumule les scores
 * de chaque lancer (l'addition est faite par l'appelant, pas ici).
 *
 * Ici on évalue UN seul lancer de dés -> le meilleur score unique.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.DiceEngine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var UNIT_1 = 100;   // chaque 1 = 100
  var UNIT_5 = 50;    // chaque 5 = 50

  var SUITE = 1500;        // 1-2-3-4-5-6 en un seul lancer
  var TROIS_PAIRES = 1000; // 3 paires différentes en un seul lancer

  // Score minimal pour qu'un vol "compte" (dés restants du joueur précédent).
  var VOL_MIN = 50;
  // Seuil à partir duquel on POSSÈDE le droit de voler.
  var VOL_PASSEPORT = 3500;

  function sameVals(a, b) { return a.every(function (x, i) { return x === b[i]; }); }
  function sorted(v) { return v.slice().sort(function (a, b) { return a - b; }); }

  // Validation : exactement des valeurs de dé 1..6.
  function isRoll(v) {
    return Array.isArray(v) && v.length > 0 &&
      v.every(function (x) { return Number.isInteger(x) && x >= 1 && x <= 6; });
  }

  // ---- Combinaisons (évaluées sur un seul lancer) -------------------------

  // Suite 1-2-3-4-5-6 ?
  function suite(dice) {
    if (dice.length !== 6) return null;
    var s = sorted(dice);
    return sameVals(s, [1, 2, 3, 4, 5, 6]) ? { points: SUITE, name: 'suite', dice: dice.slice() } : null;
  }

  // 3 paires de chiffres DIFFÉRENTS ? (1,1,5,5,6,6) ; un même nombre en 4+ n'est pas une paire.
  function troisPaires(dice) {
    if (dice.length !== 6) return null;
    var counts = {};
    dice.forEach(function (d) { counts[d] = (counts[d] || 0) + 1; });
    var pairs = Object.keys(counts).filter(function (k) { return counts[k] === 2; });
    if (pairs.length === 3) return { points: TROIS_PAIRES, name: 'troisPaires', dice: dice.slice() };
    return null;
  }

  // N dés identiques (N>=3). Si N<3, ne compte pas comme combinaison (juste unités).
  function groupement(dice) {
    // trouve la face ayant le plus grand nombre de dés identiques >= 3
    var counts = {};
    dice.forEach(function (d) { counts[d] = (counts[d] || 0) + 1; });
    var best = null, bestN = 0;
    Object.keys(counts).forEach(function (k) {
      var n = counts[k];
      if (n >= 3 && n > bestN) { best = Number(k); bestN = n; }
    });
    if (!best) return null;
    // base du brelan: x → x*100 ; si la face est 1 → 1000.
    var base = best === 1 ? 1000 : best * 100;
    // chaque dé supplémentaire (au-delà de 3) double le total.
    var points = base;
    for (var i = 3; i < bestN; i++) points *= 2;
    return { face: best, count: bestN, base: base, points: points, name: 'brelan' };
  }

  // ---- Évaluation d'UN lancer ----------------------------------------------
  // Retourne le MEILLEUR score et la combinaison retenue, ou null si aucun point.
  function scoreDice(values) {
    if (!isRoll(values)) return { error: 'roll invalide' };
    var dice = values.slice();

    var s = suite(dice);
    if (s) return s;                          // la suite consomme tout

    var tp = troisPaires(dice);
    if (tp) return tp;                        // 3 paires consomme tout

    var g = groupement(dice);
    if (g) {
      // On a un brelan/plus. Les unités libres (1/5 PAS dans le brelan) s'ajoutent.
      var toRemove = {};
      var remaining = dice.slice();
      // retire les g.count dés de la face g.face
      var removed = 0;
      var kept = [];
      remaining.forEach(function (d) {
        if (d !== g.face) kept.push(d);
        else if (removed >= g.count) kept.push(d);
        else removed++;
      });
      // les 1 et 5 restants (hors brelan) s'ajoutent comme unités libres.
      var units = 0;
      kept.forEach(function (d) { units += (d === 1 ? UNIT_1 : d === 5 ? UNIT_5 : 0); });
      g.points += units;
      g.name = g.count >= 4 ? 'brelan+' : 'brelan';
      g.unitsAdded = units;
      return g;
    }

    // Sinon, pas de combinaison : seulement les unités 1 et 5.
    var p = 0;
    var n1 = 0, n5 = 0;
    dice.forEach(function (d) {
      if (d === 1) { p += UNIT_1; n1++; }
      else if (d === 5) { p += UNIT_5; n5++; }
    });
    if (p === 0) return { points: 0, name: 'rien', dice: dice.slice() };
    return { points: p, name: 'unites', n1: n1, n5: n5, dice: dice.slice() };
  }

  // Score minimal d'un vol ("dés restants"). True si >= VOL_MIN.
  function compteDansVol(lancer) {
    var r = scoreDice(lancer);
    return r && !r.error && r.points >= VOL_MIN;
  }

  return {
    UNIT_1: UNIT_1, UNIT_5: UNIT_5, SUITE: SUITE, TROIS_PAIRES: TROIS_PAIRES,
    VOL_MIN: VOL_MIN, VOL_PASSEPORT: VOL_PASSEPORT,
    scoreDice: scoreDice, compteDansVol: compteDansVol
  };
});
</script>
<script>
/* 20K — logique du TOUR aux dés (par-dessus engine-dice).
 *
 * Pur : aucune dépendance au DOM, au stockage, au son ou au réseau.
 *
 * Un tour est une suite de lancers sur 6 dés :
 *   - on lance des dés, on évalue le lancer (engine-dice.scoreDice),
 *   - on GARDE les dés qui rapportent (1, 5, ou les dés d'une combinaison),
 *   - les dés inutiles sont relancés (on ne garde JAMAIS un dé qui ne rapporte rien),
 *   - tant que le tour n'a pas accumulé 1000 on ne peut PAS s'arrêter,
 *   - un lancer sans aucun point = perte totale de ce qui était accumulé.
 *
 * États d'un tour :
 *   { type:'rolling', inHand:[...], kept:[...], score, canStop, lancers }
 *   { type:'banked', total, lancers }
 *   { type:'perdu', total:0, lancers }          // jet sans point
 *   { type:'blocked' }                          // stop non autorisé (< 1000)
 *
 * Le moteur est DÉTERMINISTE : on passe les "dés" en paramètre (pour les tests)
 * ou on les fait générer (rollN). Une fonction pure `resolve(nextHand)` N'avance
 * le tour qu'en fonction de l'état ET du prochain lancer fourni.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(root);
  else root.TurnDice = factory(root);
})(typeof globalThis !== 'undefined' ? globalThis : this, function (root) {
  'use strict';
  var D = (typeof require !== 'undefined') ? require('./engine-dice.js') : root.DiceEngine;

  var OUVRAGE = 1000;
  var DES = 6;
  var VOL_PASSEPORT = D.VOL_PASSEPORT || 3500; // seuil pour avoir droit au vol

  // ---- Helpers ------------------------------------------------------------
  function rollN(n, nextInt) {
    var rnd = nextInt || function () { return 1 + Math.floor(Math.random() * 6); };
    var out = [];
    for (var i = 0; i < n; i++) out.push(rnd());
    return out;
  }

  // Quels dés sont "actifs" (à garder) pour ce lancer ?
  // Retourne la liste des valeurs à garder (celles qui rapportent).
  function activeToKeep(hand, res) {
    if (res.name === 'suite') return hand.slice();
    if (res.name === 'troisPaires') return hand.slice();
    if (res.name === 'brelan' || res.name === 'brelan+') {
      // garde les dés de la face majoritaire (3+) + les 1/5 libres
      var counts = {};
      hand.forEach(function (d) { counts[d] = (counts[d] || 0) + 1; });
      var bigFace = null, bigN = 0;
      Object.keys(counts).forEach(function (k) {
        if (counts[k] >= 3 && counts[k] > bigN) { bigFace = Number(k); bigN = counts[k]; }
      });
      if (bigFace === null) return hand.filter(function (d) { return d === 1 || d === 5; });
      return hand.filter(function (d) { return d === bigFace || d === 1 || d === 5; });
    }
    // unités uniquement
    return hand.filter(function (d) { return d === 1 || d === 5; });
  }

  // ---- Création / transitions ---------------------------------------------
  function fresh() { return { type: 'idle' }; }

  // Démarre un tour avec le premier lancer (6 dés) fourni ou généré.
  function start(state, firstHand) {
    var s = state.type === 'idle' || state.type === 'banked' || state.type === 'perdu' || state.type === 'blocked'
      ? { type: 'rolling', score: 0, kept: [], inHand: [], canStop: false, lancers: 0 }
      : state;
    var hand = firstHand || rollN(DES);
    return applyRoll(s, hand);
  }

  // Relance : soumettre un nouveau lancer (les dés inutiles de l'état courant).
  // En pur : l'appelant fournit `nextHand`, sinon généré.
  function roll(state, nextHand) {
    if (state.type !== 'rolling') return state;
    var incomplets = state.inHand.filter(function (d) {
      return state.kept.indexOf(d) === -1;   // les dés NON gardés deviennent la relance
    });
    var hand = nextHand || (incomplets.length > 0
      ? rollN(incomplets.length)
      : rollN(DES));   // si tout est gardé, on relance les 6
    return applyRoll(state, hand);
  }

  // Applique un lancer `hand` à l'état courant (pur).
  function applyRoll(state, hand) {
    var res = D.scoreDice(hand);
    var gained = res.points || 0;

    // Lancer sans aucun point -> perte totale.
    if (gained === 0) {
      return { type: 'perdu', total: 0, lancers: (state.lancers || 0) + 1, handLost: hand, scoreAvant: state.score };
    }

    var score = state.score + gained;
    var canStop = score >= OUVRAGE;
    var kept = activeToKeep(hand, res);
    var next = {
      type: 'rolling',
      inHand: hand,
      kept: kept,
      score: score,
      canStop: canStop,
      lancers: (state.lancers || 0) + 1,
      gained: gained,
      combinaison: res.name,
      // dés restants à relancer (ceux qui ne rapportent rien)
      toRoll: hand.filter(function (d) { return kept.indexOf(d) === -1; })
    };
    // Signal "tous les dés ont rapporté" (relance complète des 6).
    next.allScored = kept.length === hand.length;
    return next;
  }

  // Encaisser le tour (uniquement si >= 1000).
  function stop(state) {
    if (state.type !== 'rolling') return state;
    if (!state.canStop) return { type: 'blocked', reason: 'il faut au moins ' + OUVRAGE + ' points pour s\'arrêter', score: state.score };
    return { type: 'banked', total: state.score, lancers: state.lancers, kept: state.kept };
  }

  // Forcer la perte (utile pour l'UI "abandonner"). Retourne perdu.
  function jeter(state) {
    if (state.type !== 'rolling') return state;
    return { type: 'perdu', total: 0, lancers: state.lancers, scoreAvant: state.score };
  }

  // Simule un tour COMPLET à partir d'une suite de lancers fournis (test).
  // `suite` = [[6 dés], [dés relancés], ...] ; retourne l'état final.
  function simulate(suite) {
    if (!suite || suite.length === 0) return { type: 'perdu', total: 0, lancers: 0 };
    var s = fresh();
    s = start(s, suite[0]);
    for (var i = 1; i < suite.length; i++) {
      if (s.type === 'rolling') s = roll(s, suite[i]);
      else break;
    }
    return s;
  }

  // ---- Vol -----------------------------------------------------------------
  // Décide si le vol est possible (droit + place). Ne modifie aucun état : c'est
  // un prédicat utilisé par l'UI pour montrer/permettre le bouton « voler ».
  //   voleurScore   : total actuel du joueur qui veut voler
  //   gainPrecedent : gain (dernier score) du joueur précédent à voler
  //   production    : ce que le voleur compte encaisser ce tour (0 si pas encore)
  //   TARGET        : 20000 (ou réglage)
  function canVol(voleurScore, gainPrecedent, production, TARGET_) {
    if (!gainPrecedent || gainPrecedent <= 0) return false;       // rien à voler
    if (voleurScore < VOL_PASSEPORT) return false;                // pas 3 500+
    TARGET_ = TARGET_ || 20000;
    // place : volé + production + 50 marge <= TARGET
    return voleurScore + gainPrecedent + production + 50 <= TARGET_;
  }

  return {
    OUVRAGE: OUVRAGE, DES: DES,
    fresh: fresh, start: start, roll: roll, stop: stop, jeter: jeter,
    applyRoll: applyRoll, simulate: simulate, rollN: rollN, activeToKeep: activeToKeep,
    canVol: canVol, VOL_PASSEPORT: VOL_PASSEPORT
  };
});
</script>
<script>
/* 20K — interface (écran, son, voix, sauvegarde).
 * Toute la logique de jeu vient de Engine.reduce() ; ce fichier ne fait
 * qu'afficher l'état et traduire les taps en actions.
 */
(() => {
  const E = window.Engine;
  const { TARGET, MIN_OPEN, MIN_VOL, STEPS, SAY_REMAINING, VOL_SOUND_MIN } = E;
  const fmt = E.fmt;

  const KEY = '20k-scorecard-v1';
  const KEY_DES = '20k-scorecard-v1-des';
  const VERSION = '3.73';

  // dice-mode motors
  const D = window.DiceEngine;
  const T = window.TurnDice;
  const DICE_GLYPH = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  const DES_TARGET = 20000;
  const DES_VOL_MIN_PROD = 50; // production minimale exigée pour encaisser un vol
  // Couleur par VALEUR de dé : 6 = vert (bon), 1 = rouge (mauvais), dégradé entre deux.
  const VALUE_COLORS = {
    6: '#16833c',   // vert
    5: '#4f9d33',   // vert-jaune
    4: '#9aa91f',   // jaune verdâtre
    3: '#c49a18',   // ambre/jaune
    2: '#d06d10',   // orange
    1: '#c9302c'    // rouge
  };
  const dieValueColor = v => VALUE_COLORS[v] || '#5d6878';

  // Couleur distincte par jet de dés gardé (utilisée dans l'export / log).
  const JET_COLORS = [
    '#1f5fd6', '#16833c', '#7a3fc4', '#d06d10', '#c9302c', '#0e7f96'
  ];
  const jetColor = n => JET_COLORS[((n || 1) - 1 + JET_COLORS.length) % JET_COLORS.length];

  // Couleurs pastel pour les avatars / pastilles des joueurs du répertoire.
  const PLAYER_COLORS = ['#1f5fd6', '#16833c', '#7a3fc4', '#d06d10', '#c9302c', '#0e7f96', '#9aa91f', '#b4500f'];

  // ---- Répertoire de joueurs (profil persistant, utilisable sur plusieurs
  // appareils à terme). Clé localStorage séparée de l'état de partie pour
  // préparer une future synchronisation multi-device.
  const KEY_PLAYERS = '20k-players';
  let roster = { players: [], updatedAt: 0 };
  function loadRoster() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY_PLAYERS));
      if (!raw || !Array.isArray(raw.players)) { roster = { players: [], updatedAt: 0 }; return; }
      const players = raw.players
        .filter(p => p && typeof p.name === 'string' && p.name.trim())
        .map(p => ({
          id: typeof p.id === 'string' ? p.id : uid(),
          name: p.name.trim(),
          color: typeof p.color === 'string' ? p.color : PLAYER_COLORS[Math.floor(Math.random() * PLAYER_COLORS.length)],
          stats: p.stats && typeof p.stats === 'object'
            ? { games: +p.stats.games || 0, wins: +p.stats.wins || 0, points: +p.stats.points || 0 }
            : { games: 0, wins: 0, points: 0 }
        }));
      roster = { players, updatedAt: typeof raw.updatedAt === 'number' ? raw.updatedAt : Date.now() };
    } catch (e) { roster = { players: [], updatedAt: 0 }; }
  }
  function saveRoster() {
    roster.updatedAt = Date.now();
    try { localStorage.setItem(KEY_PLAYERS, JSON.stringify(roster)); } catch (e) {}
  }
  function uid() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function findPlayer(id) { const s = String(id); return roster.players.find(p => String(p.id) === s) || null; }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---- State -------------------------------------------------------------
  function fresh() {
    return Object.assign(E.createGame([]), { screen: 'setup', count: 4, sound: true });
  }
  // Older or partial saves must never break the render: Engine.normalize fills
  // in what is missing.
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (!raw || !raw.screen) return null;
      const g = E.normalize(raw);
      if (!g) return null;
      return Object.assign(g, {
        screen: (raw.screen === 'game' && g.players.length) ? 'game' : 'setup',
        count: typeof raw.count === 'number' ? raw.count : (g.players.length || 4),
        sound: raw.sound !== false
      });
    } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // Cette version est dédiée au jeu de dés : le mode tableau est retiré de l'UI.
  // On fixe toujours le mode dés (le stockage garde de la place pour plus tard).
  const KEY_MODE = '20k-scorecard-mode';
  let MODE = 'des';
  function saveMode() { try { localStorage.setItem(KEY_MODE, MODE); } catch (e) {} }

  let S = load() || fresh();
  let msg = null, msgTimer = 0;
  let confirmNew = false, confirmStart = false, confirmTimer = 0;
  let pulseVol = false;
  let sheet = null; // 'log' when the turn history is open
  let editingPlayer = null; // id du joueur en cours d'édition dans le répertoire, ou '' pour un nouveau
  let editingName = '', editingColor = '';

  // ---- Mode dés (état de partie distinct, clé localStorage « -des ») --------
  function freshDes() {
    return {
      screen: 'setup-des', count: 4, names: [], players: [], playerIds: [], selected: [],
      current: 0, winner: null, prevTurn: null,
      turn: null, phase: 'idle', steal: null, log: [], keptByRoll: [],
      gameId: 1, jetLog: [], stats: [], histView: -1
    };
  }
  function loadDes() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY_DES));
      if (!raw || !raw.screen) return null;
      const d = freshDes();
      const players = Array.isArray(raw.players) ? raw.players.map(p =>
        (!p || typeof p.score !== 'number') ? { score: 0, last: null } : {
          score: p.score, last: typeof p.last === 'number' ? p.last : null }) : [];
      if (!(raw.screen === 'game-des') || !players.length) {
        // En écran de config (ou partie sans joueur), on conserve quand même
        // l'historique, le compteur de parties et la sélection courante pour
        // l'affichage de l'accueil.
        d.stats = Array.isArray(raw.stats) ? raw.stats.filter(s => s && typeof s.ts === 'number') : [];
        d.gameId = Number.isInteger(raw.gameId) ? raw.gameId : 1;
        d.selected = Array.isArray(raw.selected) ? raw.selected.filter(p => typeof p === 'string') : [];
        d.count = Number.isInteger(raw.count) && raw.count >= 2 ? raw.count : 4;
        return d;
      }
      d.screen = 'game-des';
      d.players = players;
      d.names = Array.isArray(raw.names) ? raw.names.map((n, i) => (typeof n === 'string' && n.trim()) ? n : 'Joueur ' + (i + 1)) : [];
      d.playerIds = Array.isArray(raw.playerIds) ? raw.playerIds.filter(p => typeof p === 'string') : [];
      d.selected = Array.isArray(raw.selected) ? raw.selected.filter(p => typeof p === 'string') : [];
      d.count = Array.isArray(raw.names) ? raw.names.length : (typeof raw.count === 'number' ? raw.count : 4);
      d.current = Number.isInteger(raw.current) && raw.current >= 0 && raw.current < players.length ? raw.current : 0;
      d.winner = Number.isInteger(raw.winner) && raw.winner >= 0 && raw.winner < players.length ? raw.winner : null;
      d.prevTurn = (raw.prevTurn && Number.isInteger(raw.prevTurn.player) && typeof raw.prevTurn.gain === 'number')
        ? { player: raw.prevTurn.player, gain: raw.prevTurn.gain, leftoverDice: Array.isArray(raw.prevTurn.leftoverDice) ? raw.prevTurn.leftoverDice : [] }
        : null;
      d.turn = raw.turn || null;
      d.phase = raw.phase === 'normal' || raw.phase === 'steal' ? raw.phase : 'idle';
      d.steal = null;
      d.log = Array.isArray(raw.log) ? raw.log.filter(e => e && typeof e.n === 'number') : [];
      d.keptByRoll = Array.isArray(raw.keptByRoll) ? raw.keptByRoll.filter(g => g && Number.isInteger(g.jet)) : [];
      d.gameId = Number.isInteger(raw.gameId) ? raw.gameId : 1;
      d.jetLog = Array.isArray(raw.jetLog) ? raw.jetLog.filter(e => e && typeof e.n === 'number') : [];
      d.stats = Array.isArray(raw.stats) ? raw.stats.filter(s => s && typeof s.ts === 'number') : [];
      return d;
    } catch (e) {}
    return null;
  }
  function saveDes() { try { localStorage.setItem(KEY_DES, JSON.stringify(DS)); } catch (e) {} }
  let DS = loadDes() || freshDes();
  loadRoster();
  // Sur un tout premier chargement (répertoire vide), on place quelques joueurs
  // d'exemple pour montrer la sélection et les statistiques. Marqué par un flag
  // pour ne pas ré-injecter après une suppression volontaire.
  if (!roster.players.length && (function () { try { return !localStorage.getItem('20k-players-demo'); } catch (e) { return false; } })()) {
    const seed = [
      ['Anne', '#1f5fd6', { games: 14, wins: 5, points: 210500 }],
      ['Benoît', '#d06d10', { games: 11, wins: 2, points: 152000 }],
      ['Carla', '#7a3fc4', { games: 9, wins: 4, points: 174300 }],
      ['Denis', '#16833c', { games: 6, wins: 1, points: 88000 }]
    ];
    roster.players = seed.map(([name, color, st]) => ({ id: uid(), name, color, stats: st }));
    saveRoster();
    try { localStorage.setItem('20k-players-demo', '1'); } catch (e) {}
  }

  // ---- Exemple de données (démo) pour tester l'historique -------------------
  // Ne s'applique qu'une seule fois au tout premier chargement, pour que la
  // liste « Parties terminées » (et la reprise d'une partie) soit visible et
  // testable avant d'avoir fini une vraie partie. Marqué « démo » dans le nom.
  const KEY_DEMO = '20k-scorecard-v1-des-demo';
  function seedDesDemo() {
    if (DS.stats.length) return;              // de vraies parties existent déjà
    const now = Date.now();
    const one = 60000, hour = 3600000;
    DS.stats.push({                      // partie terminée il y a ~2 jours
      ts: now - 2 * 24 * hour, g: 0, v: VERSION,
      names: ['Anne', 'Benoît', 'Carla'],
      players: [{ score: 20000, last: 300 }, { score: 16450, last: 0 }, { score: 13200, last: 0 }],
      winner: 0, jets: 41
    });
    DS.stats.push({                      // partie terminée il y a ~1 heure
      ts: now - 1 * hour - one * 20, g: 1, v: VERSION,
      names: ['Denis', 'Éva'],
      players: [{ score: 12050, last: 450 }, { score: 20000, last: 200 }],
      winner: 1, jets: 27
    });
    // Pas de partie en cours injectée : la démo ne doit pas « prêter » ses noms
    // (Alice/Bob/…) à une vraie nouvelle partie. La carte « Reprendre » n'apparaît
    // donc que pour une vraie partie interrompue, et « Commencer une partie »
    // propose les noms par défaut (Joueur 1, Joueur 2, …).
    try { localStorage.setItem(KEY_DEMO, '1'); } catch (e) {}
    saveDes();
  }
  // L'exemple n'est injecté QUE sur un tout premier chargement vierge (aucune
  // partie en cours, aucun joueur, aucun historique) : jamais sur une vraie
  // partie déjà commencée, ni une fois l'exemple déjà posé (KEY_DEMO).
  function neverSeeded() { try { return !localStorage.getItem(KEY_DEMO); } catch (e) { return false; } }

  // Nettoyage d'une ancienne démo résiduelle (versions 3.42+ ) : elle avait
  // injecté une « partie en cours » Alice/Bob/Charlie dont les noms se
  // propageaient aux nouvelles parties. Si on détecte cette partie fantôme
  // (joueurs nommés uniquement parmi {Alice, Bob, Charlie}, issus de la démo),
  // on la retire (l'historique est conservé) pour revenir à un accueil propre.
  function stripDemoResume() {
    try {
      const gm = DS.names, pl = DS.players;
      if (!Array.isArray(pl) || !pl.length) return;
      const demoNames = new Set(['Alice', 'Bob', 'Charlie']);
      const isDemo = Array.isArray(gm)
        && gm.every(n => demoNames.has(n))
        && pl.length === gm.length && gm.length >= 1 && gm.length <= 3;
      if (isDemo) {
        DS.names = []; DS.players = []; DS.count = 4; DS.current = 0;
        DS.screen = 'setup-des';
        DS.prevTurn = null; DS.turn = null; DS.phase = 'idle'; DS.steal = null;
        DS.log = []; DS.keptByRoll = []; DS.jetLog = [];
        saveDes();
      }
    } catch (e) {}
  }

  if (!DS.stats.length && DS.screen === 'setup-des' && !DS.names.length && !DS.players.length && neverSeeded()) {
    seedDesDemo();
  }
  stripDemoResume();
  const inDesMode = () => MODE === 'des' && (DS.screen === 'setup-des' || DS.screen === 'game-des');

  // ---- Actions du mode dés -----------------------------------------------
  const dNext = i => (i + 1) % DS.players.length;

  function dAdvance() {
    const p = DS.players[DS.current];
    if (p.score === DES_TARGET) DS.winner = DS.current;
    else DS.current = dNext(DS.current);
  }
  function dBank(production, leftoverDice) {
    const p = DS.players[DS.current];
    const isSteal = DS.phase === 'steal';
    const gain = isSteal ? DS.steal.gainToSteal : 0;   // gain volé (copie, rien ne change sur le volé)
    const bank = gain + production;
    if (p.score + bank > DES_TARGET) {
      flash('bad', 'Score trop élevé', 'Ça dépasserait ' + E.fmt(DES_TARGET) + '. Il faudrait encaisser exactement ' + E.fmt(DES_TARGET - p.score) + '.');
      saveDes(); render();
      return;
    }
    // Dés restants du joueur = ceux de son dernier lancer non gardés (source du vol).
    const leftover = (leftoverDice || []).filter(d => d >= 1 && d <= 6);
    p.score += bank; p.last = bank;
    DS.prevTurn = { player: DS.current, gain: bank, leftoverDice: leftover };
    DS.log.push({
      i: DS.current, n: DS.log.length + 1,
      add: production, stolen: gain, total: bank,
      pass: false, after: p.score
    });
    // Historique : on consigne l'encaissement (vol ou normal) pour validation ultérieure.
    const wasVol = gain > 0;
    DS.jetLog.push({
      v: VERSION, g: DS.gameId, n: DS.log.length, t: Date.now(), p: DS.current, j: -1,
      dice: [], gained: bank, cumul: bank, comb: wasVol ? 'vol' : 'bank', kind: wasVol ? 'vol-bank' : 'bank'
    });
    dAdvance();
    if (DS.winner !== null) {
      dArchive();
      if (S.sound !== false) { victory(); say(DS.names[DS.winner] + ' gagne avec ' + E.fmt(DES_TARGET) + ' points!', null); }
    }
    DS.turn = null; DS.phase = 'idle'; DS.steal = null;
    return { wasVol, gain, bank };
  }
  function dLose() {
    const st = DS.turn;
    const wasSteal = DS.phase === 'steal';
    DS.log.push({ i: DS.current, n: DS.log.length + 1, add: 0, stolen: 0, total: 0, pass: true, after: DS.players[DS.current].score });
    // Une perte efface l'occasion de vol (comme « Aucun point » au tableau).
    DS.prevTurn = null;
    dAdvance();
    DS.turn = null; DS.phase = 'idle'; DS.steal = null;
    return { wasSteal };
  }
  // Enregistre chaque lancer (jet) pour l'historique consultable / exportable.
  // kind : 'roll' (jet normal), 'perdu', 'bank' (encaissé), 'vol' (jet en phase de vol)
  function recordJet(kind, extra) {
    const st = DS.turn;
    const rollNum = (st && st.lancers) || 0;
    const dice = (st && (Array.isArray(st.handLost) ? st.handLost : st.inHand)) || [];
    DS.jetLog.push({
      v: VERSION,                // version du logiciel (pour validation)
      g: DS.gameId,              // numéro de partie
      n: DS.log.length + 1,      // numéro de tour
      t: Date.now(),             // horodatage
      p: DS.current,             // joueur
      j: rollNum,                // numéro de lancer dans le tour
      dice: dice,                // les dés jetés
      color: jetColor(rollNum - 1),   // couleur du jet (per-jet, distinct de la valeur)
      gained: (st && st.gained) || 0,          // points du lancer
      cumul: (st && st.score) || (st && st.total) || 0,  // total du tour
      comb: (st && st.combinaison) || (extra && extra.comb) || '',
      kept: (st && st.kept) || [],
      kind: kind
    });
  }
  function resetJetLog() { DS.jetLog = []; }
  // Archive une partie terminée dans l'historique (stats) des parties.
  function dArchive() {
    DS.stats.push({
      ts: Date.now(),           // date de fin
      g: DS.gameId,             // numéro de partie
      v: VERSION,               // version utilisée
      names: DS.names.slice(),
      players: DS.players.map(p => ({ score: p.score, last: p.last })),
      winner: DS.winner,
      jets: DS.jetLog.length    // nb de jets enregistrés
    });
    // Mise à jour des statistiques des joueurs du répertoire.
    const ids = (DS.playerIds || []);
    if (ids.length && (DS.winner !== null && DS.winner >= 0 && DS.winner < DS.players.length)) {
      ids.forEach((id, i) => {
        const p = findPlayer(id);
        if (!p) return;
        p.stats.games += 1;
        p.stats.points += (DS.players[i] ? DS.players[i].score : 0);
        if (i === DS.winner) p.stats.wins += 1;
      });
      saveRoster();
    }
    DS.gameId = DS.gameId + 1;  // prochaine partie
  }
  function dVolOffer() {
    if (DS.phase !== 'idle' || DS.turn) return false;   // seulement avant le lancer d'un tour
    if (DS.screen !== 'game-des') return false;
    if (DS.winner !== null) return false;
    const p = DS.players[DS.current];
    const vt = DS.prevTurn;
    if (!vt || vt.gain <= 0 || vt.player === DS.current) return false;
    return T.canVol(p.score, vt.gain, 0, DES_TARGET);
  }
  function dStealReason() {
    if (DS.phase !== 'idle') return '';
    const p = DS.players[DS.current];
    const vt = DS.prevTurn;
    if (!vt || vt.gain <= 0) return 'Aucun gain à voler';
    if (vt.player === DS.current) return '';
    if (p.score < T.VOL_PASSEPORT) return 'Nécessite ' + E.fmt(T.VOL_PASSEPORT) + ' points minimum';
    if (T.canVol(p.score, vt.gain, 0, DES_TARGET)) return '';
    return 'Pas assez de place pour voler ' + E.fmt(vt.gain) + ' + 50';
  }

  function dAct(a, v) {
    switch (a) {
      case 'godes':      // depuis l'accueil tableau -> mode dés
        MODE = 'des'; saveMode();
        if (!DS.screen || DS.screen === 'setup-des') DS.screen = 'setup-des';
        break;
      case 'gotab':      // depuis le mode dés -> mode tableau
        MODE = 'tab'; saveMode();
        S.screen = 'setup';
        break;
      case 'count': DS.count = +v; saveDes(); break;
      case 'togsel': {   // cocher/décocher un joueur du répertoire pour la partie
        const id = String(v); DS.selected = DS.selected || [];
        DS.selected = DS.selected.includes(id) ? DS.selected.filter(x => x !== id) : DS.selected.concat(id);
        if (DS.selected.length >= 2) DS.count = DS.selected.length;
        saveDes();
        break;
      }
      case 'roster': DS.screen = 'roster'; saveDes(); OL.error = ''; olEnsureConn(); break;
      case 'backdes': DS.screen = 'setup-des'; saveDes(); break;
      case 'pedit':   // éditer un joueur (v=id, vide = nouveau)
        if (v) { const p = findPlayer(v); editingName = p ? p.name : ''; editingColor = p ? p.color : ''; }
        else { editingName = ''; editingColor = PLAYER_COLORS[0]; }
        editingPlayer = (v || '');
        render(); break;
      case 'pfield': editingName = String(v == null ? '' : v).slice(0, 18); render(); break;
      case 'setcolor': editingColor = String(v); render(); break;
      case 'psave': {  // enregistrer le formulaire de l'éditeur de joueurs
        const name = editingName.trim();
        const connected = !!(OL.ws && OL.ws.readyState === 1);
        if (editingPlayer) {
          const p = findPlayer(editingPlayer);
          if (p) {
            const newName = name || p.name;
            const newColor = editingColor || p.color;
            if (connected) {
              if (typeof p.id === 'number') {
                // Mutation via HTTP /roster (worker) ; repli WS si HTTP échoue.
                if (p.name !== newName) olRosterMutate({ op: 'rename', id: p.id, name: newName }, { type: 'rosterRename', id: p.id, name: newName });
                if (p.color !== newColor) olRosterMutate({ op: 'color', id: p.id, color: newColor }, { type: 'rosterColor', id: p.id, color: newColor });
                if (p.name === newName && p.color === newColor) olRosterMutate({ op: 'get' }, { type: 'rosterGet' });
              } else {
                // pas encore migré : maj locale, la synchro le poussera
                p.name = newName; p.color = newColor; saveRoster();
              }
            } else {
              p.name = newName; p.color = newColor;
              saveRoster();
            }
          }
        } else if (name) {
          if (connected) {
            // Ajout via HTTP /roster (worker) : le serveur attribue un id numérique.
            olRosterMutate({ op: 'add', name, color: editingColor || PLAYER_COLORS[0] }, { type: 'rosterAdd', name, color: editingColor || PLAYER_COLORS[0] });
          } else {
            roster.players.push({ id: uid(), name, color: editingColor || PLAYER_COLORS[0], stats: { games: 0, wins: 0, points: 0 } });
            saveRoster();
          }
        }
        editingPlayer = null; editingName = ''; editingColor = '';
        render(); break;
      }
      case 'pcancel': editingPlayer = null; editingName = ''; editingColor = ''; render(); break;
      case 'pdel': {   // supprimer un joueur
        const id = String(v);
        const p = findPlayer(id);
        roster.players = roster.players.filter(x => String(x.id) !== id);
        DS.selected = (DS.selected || []).filter(x => String(x) !== id);
        saveRoster(); saveDes();
        if (OL.ws && OL.ws.readyState === 1 && p && typeof p.id === 'number') {
          // Suppression via HTTP /roster (worker) ; repli WS. Le serveur retire l'id
          // (jamais réattribué) et conserve l'historique des stats.
          olRosterMutate({ op: 'del', id: p.id }, { type: 'rosterDel', id: p.id });
        }
        if (OL.profile && OL.profile.id != null && String(OL.profile.id) === id) OL.profile = null;
        render(); break;
      }
      case 'start': {
        const ids = (DS.selected || []).filter(id => findPlayer(id));
        if (ids.length < 2) break;   // il faut au moins 2 joueurs du répertoire
        DS.playerIds = ids.slice();
        // Garder l'ordre des joueurs du répertoire ; noms pris depuis les profils.
        DS.names = ids.map(id => findPlayer(id).name);
        DS.players = DS.names.map(() => ({ score: 0, last: null }));
        DS.count = DS.names.length;
        DS.current = 0; DS.winner = null; DS.prevTurn = null;
        DS.turn = null; DS.phase = 'idle'; DS.steal = null; DS.log = []; DS.keptByRoll = [];
        DS.jetLog = [];
        if (DS.gameId <= 0) DS.gameId = 1;
        DS.screen = 'game-des';
        saveDes();
        break;
      }
      case 'detview': {   // voir le détail final (lecture seule) d'une partie terminée
        const idx = +v;
        const past = DS.stats[idx];
        if (!past) break;
        DS.histView = idx;   // on rendra le détail de cette partie archivée
        DS.screen = 'dethist';
        break;
      }
      case 'backhist': DS.histView = -1; DS.screen = 'setup-des'; saveDes(); break;
      case 'lancier': {   // début de tour normal (renonce au vol)
        DS.turn = T.start(T.fresh());
        DS.phase = 'normal';
        DS.keptByRoll = [];   // le 1er jet s'affiche via la main courante
        if (DS.turn.type === 'rolling') recordJet('roll');
        break;
      }
      case 'rolldes': {   // relancer les dés non gardés
        const st = DS.turn;
        if (!st || st.type !== 'rolling') break;
        // Quand le jet précédent a rapporté sur TOUS ses dés (allScored), la
        // relance rejoue les 6 dés : AUCUN dé n'est tenu, on vide keptByRoll.
        // Sinon, les dés gardés de ce jet deviennent « tenus » (colorés par jet).
        const prevAllScored = !!st.allScored;
        const prevKept = (st.kept || []);
        const prevJet = st.lancers || 1;
        DS.turn = T.roll(st);
        if (DS.turn.type === 'perdu') { recordJet('perdu'); break; }
        recordJet('roll');
        if (prevAllScored) {
          DS.keptByRoll = [];
        } else if (prevKept.length) {
          DS.keptByRoll.push({ jet: prevJet, dice: prevKept });
        }
        break;
      }
      case 'dasser': {   // après un tour perdu, passer au joueur suivant (sans son)
        if (DS.turn && DS.turn.type === 'perdu') dLose();
        break;
      }
      case 'stopdes': {   // encaisser
        const st = DS.turn;
        if (!st || st.type !== 'rolling') break;
        const leftover = (st.toRoll || []).slice();
        if (DS.phase === 'steal') {
          if (st.score < DES_VOL_MIN_PROD) break;   // il faut au moins 50 produits
          DS.turn = st;                              // conserve le rolling pour le log/renvoi
          dBank(st.score, leftover);
        } else {
          const playerStarted = (DS.players[DS.current].score > 0);
          const threshold = playerStarted ? 1 : T.OUVRAGE;   // 1000 seulement au 1er score
          if (st.score < threshold) break;
          const production = st.score;
          // Validation via le moteur pour le 1er score (exige 1000) ; sinon,
          // un joueur déjà ouvert peut encaisser dès 1 point (l'état banked est
          // simplement fabriqué sans recoder les règles de scoring).
          let banked;
          if (playerStarted) {
            banked = { type: 'banked', total: st.score, lancers: st.lancers, kept: st.kept };
          } else {
            banked = T.stop(st);
          }
          if (!banked || banked.type !== 'banked') break;
          DS.turn = banked;
          dBank(production, leftover);
        }
        break;
      }
      case 'volerd': {    // démarrer une phase de vol sur les dés restants du précédent
        const vt = DS.prevTurn;
        if (!dVolOffer() || !vt) break;
        // On repart des dés restants du précédent ; s'il n'en a laissé aucun,
        // on lui ré-attribue une main neuve de 6 dés (règle vol ré-attribué).
        const hand = (vt.leftoverDice && vt.leftoverDice.length)
          ? vt.leftoverDice : undefined;
        DS.steal = { sourcePlayer: vt.player, gainToSteal: vt.gain, leftoverDice: hand };
        DS.turn = T.start(T.fresh(), hand);
        DS.phase = 'steal';
        DS.keptByRoll = [];   // le 1er jet de vol s'affiche via la main courante
        if (DS.turn.type === 'rolling') recordJet('vol');
        break;
      }
      case 'dresume':    // reprendre la partie aux dés en cours
        DS.screen = 'game-des';
        break;
      case 'desnew': {   // nouvelle partie aux dés -> écran de configuration
        DS.screen = 'setup-des';
        DS.turn = null; DS.phase = 'idle'; DS.steal = null; DS.keptByRoll = [];
        if (DS.winner !== null) {  // après une victoire on repasse par l'écran de config
          DS.players = []; DS.names = []; DS.winner = null; DS.prevTurn = null; DS.log = [];
        }
        break;
      }
      case 'sound':
        S.sound = S.sound === false; save(); break;
      case 'deslog': {   // exporter l'historique des jets (validation)
        try {
          const blob = JSON.stringify({ app: VERSION, exportedAt: new Date().toISOString(), jets: DS.jetLog }, null, 2);
          const d = document.createElement('textarea'); d.value = blob; document.body.appendChild(d); d.select();
          let copied = false;
          try { copied = document.execCommand('copy'); } catch (e) {}
          if (navigator.clipboard && navigator.clipboard.writeText && !copied) {
            navigator.clipboard.writeText(blob).catch(() => {});
            copied = true;
          }
          document.body.removeChild(d);
          flash('good', 'Historique copié', 'Le détail des jets (version ' + VERSION + ') a été copié dans le presse-papier.');
        } catch (e) { flash('warn', 'Export', 'Impossible de copier l\'historique.'); }
        break;
      }
      case 'online': oDo('online'); break;
      case 'ocreate': oDo('ocreate'); break;
      case 'ojoin': oDo('ojoin'); break;
      case 'orejoin': oDo('orejoin'); break;
      case 'ostart': oDo('ostart'); break;
      case 'orestart': oDo('orestart'); break;
      case 'oleave': oDo('oleave'); break;
      case 'obank': oDo('obank'); break;
      case 'olost': oDo('olost'); break;
      case 'oroll': oDo('oroll'); break;
      case 'orollall': oDo('orollall'); break;
      case 'ovol': oDo('ovol'); break;
      case 'ostats': oDo('ostats'); break;
      case 'refreshstats': oDo('ostats'); break;
      case 'logtoggle': oDo('logtoggle'); break;
      case 'oinput': oDo('oinput', v); break;
      case 'osetp': oDo('osetp', v); break;
      case 'ojoincode': oDo('ojoincode', v); break;
      case 'ocodetoggle': oDo('ocodetoggle', v); break;
      case 'opendingleave': oDo('opendingleave', v); break;
      case 'oaccept': oDo('oaccept', v); break;
      case 'orefuse': oDo('orefuse', v); break;
      case 'ogame': DS.screen = 'ogame'; break;
      default: break;
    }
    saveDes(); render();
  }

  // ---- Sounds: fanfare (a team reaches 3 500 = can steal from now on), siren (steal of 1 000+), buzzer (steal won't fit) ----
  let actx = null;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  function audio() {
    try {
      if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function siren() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03, dur = 1.6;
      const osc = a.createOscillator(), lp = a.createBiquadFilter(), gain = a.createGain();
      osc.type = 'sawtooth'; lp.type = 'lowpass'; lp.frequency.value = 2200;
      osc.frequency.setValueAtTime(650, t);
      for (let i = 0; i < 2; i++) {
        osc.frequency.linearRampToValueAtTime(1150, t + i * 0.8 + 0.4);
        osc.frequency.linearRampToValueAtTime(650, t + i * 0.8 + 0.8);
      }
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.2, t + 0.05);
      gain.gain.setValueAtTime(0.2, t + dur - 0.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(lp); lp.connect(gain); gain.connect(a.destination);
      osc.start(t); osc.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function tone(a, type, freq, start, dur, vol) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
    g.gain.setValueAtTime(vol, start + dur - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(a.destination); o.start(start); o.stop(start + dur + 0.02);
  }
  function fanfare() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03;
      [[523.25, 0, .14], [659.25, .14, .14], [783.99, .28, .14], [1046.5, .42, .55]].forEach(([f, st, d]) => {
        tone(a, 'square', f, t + st, d, 0.12); tone(a, 'triangle', f * 2, t + st, d, 0.05);
      });
    } catch (e) {}
  }
  function buzzer() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03;
      tone(a, 'sawtooth', 110, t, 0.8, 0.22); tone(a, 'square', 116, t, 0.8, 0.12);
    } catch (e) {}
  }
  // Winner: rising arpeggio, held chord, then a low root under it.
  function victory() {
    if (S.sound === false) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + 0.03;
      [[523.25, 0, .16], [659.25, .16, .16], [783.99, .32, .16], [1046.5, .48, .42],
       [1318.5, .94, .14], [1567.98, 1.08, .14]].forEach(([f, st, d]) => {
        tone(a, 'square', f, t + st, d, 0.12); tone(a, 'triangle', f * 2, t + st, d, 0.05);
      });
      [[1046.5, 1.24, 1.15], [1318.5, 1.24, 1.15], [1567.98, 1.24, 1.15]].forEach(([f, st, d]) => {
        tone(a, 'triangle', f, t + st, d, 0.09);
      });
      tone(a, 'sine', 261.63, t + 1.24, 1.15, 0.12);
    } catch (e) {}
  }
  // Called when a new turn starts after a score.
  function volAlert() {
    const p = S.players[S.current], t = S.prevTurn;
    if (!t || t.points <= 0 || t.player === S.current || p.score < MIN_VOL) return;
    if (!E.volFits(S)) return buzzer;
    pulseVol = true;
    if (t.points >= VOL_SOUND_MIN) return siren;
  }

  // ---- Voice: French female voice (Amélie on iPhone/iPad when available) ----
  let frVoice = null;
  function pickVoice() {
    try {
      const fr = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang));
      const pref = ['Amélie', 'Amelie', 'Audrey', 'Aurélie', 'Marie', 'Julie', 'Céline', 'Chantal', 'Sylvie', 'Hortense', 'Denise', 'Google français'];
      frVoice = pref.map(n => fr.find(v => v.name.includes(n))).find(Boolean)
        || fr.find(v => /fr-CA/i.test(v.lang)) || fr[0] || null;
    } catch (e) { frVoice = null; }
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) { speechSynthesis.onvoiceschanged = pickVoice; }
  }
  // iOS only lets a page speak once speech has been started from a tap: do it silently on the first tap.
  let speechUnlocked = false, utt = null;
  function unlockSpeech() {
    if (speechUnlocked || !('speechSynthesis' in window)) return;
    speechUnlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; utt = u; speechSynthesis.speak(u); } catch (e) {}
  }
  function say(text, then) {
    let done = false;
    const fin = () => { if (!done) { done = true; if (then) then(); } };
    if (S.sound === false || !('speechSynthesis' in window)) { fin(); return; }
    try {
      if (!frVoice) pickVoice();
      try { speechSynthesis.resume(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(text);
      utt = u; // keep a reference so Safari doesn't drop it mid-sentence
      if (frVoice) { u.voice = frVoice; u.lang = frVoice.lang; } else u.lang = 'fr-CA';
      u.rate = 1; u.pitch = 1.1;
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 5000);
      speechSynthesis.speak(u);
    } catch (e) { fin(); }
  }

  function flash(kind, title, text) {
    msg = { kind, title, text };
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msg = null; render(); }, 3500);
  }

  function startGame(n) {
    Object.assign(S, E.createGame(S.names.slice(0, n)));
    S.screen = 'game';
    msg = null; sheet = null;
  }
  // A game that is in progress and could still be resumed from the setup screen.
  const resumable = () => S.players.length > 0 && S.winner === null;
  // Partie aux dés en cours (non terminée) — peut être reprise de l'accueil.
  const desResumable = () => DS.players.length > 0 && DS.winner === null;

  // Plays the sounds and the voice for a scored turn, in order:
  // victory -> fanfare (just reached 3 500) -> voice (1 500 or less left) -> steal sound for the next team.
  function playScored(ev) {
    const rem = TARGET - ev.after;
    const steps = [];
    if (ev.won) {
      steps.push(done => { victory(); setTimeout(done, 1700); });
      steps.push(done => say(`${S.names[ev.player]} gagne avec ${fmt(TARGET)} points!`, done));
    } else {
      if (ev.before < MIN_VOL && ev.after >= MIN_VOL) steps.push(done => { fanfare(); setTimeout(done, 1100); });
      if (rem <= SAY_REMAINING) steps.push(done => say(`${S.names[ev.player]}, il reste ${rem} points.`, done));
      const fx = volAlert();
      if (fx) steps.push(done => { fx(); done(); });
    }
    (function run() { const st = steps.shift(); if (st) st(run); })();
  }

  // ---- Actions -----------------------------------------------------------
  const GAME_ACTIONS = { add: 1, vol: 1, clear: 1, pass: 1, submit: 1, undo: 1, redo: 1 };

  function act(a, v) {
    let moved = false;
    pulseVol = false;

    if (GAME_ACTIONS[a]) {
      const r = E.reduce(S, { type: a, v: v === undefined ? undefined : +v });
      if (r.error) {
        flash(r.error.kind, r.error.title, r.error.text);
      } else {
        Object.assign(S, r.state);
        const ev = (r.events || [])[0];
        if (ev) {
          moved = true; msg = null;
          if (ev.type === 'scored') playScored(ev);
        }
      }
    } else {
      switch (a) {
        case 'sound':
          S.sound = S.sound === false;
          if (S.sound) say('Son activé', siren);
          break;
        case 'count': S.count = +v; break;
        case 'start':
          if (resumable() && !confirmStart) {
            confirmStart = true; clearTimeout(confirmTimer);
            confirmTimer = setTimeout(() => { confirmStart = false; render(); }, 3000);
            break;
          }
          confirmStart = false;
          S.names = Array.from({ length: S.count }, (_, i) => S.names[i] || `Joueur ${i + 1}`);
          startGame(S.count); break;
        case 'resume':
          confirmStart = false; S.screen = 'game'; msg = null; sheet = null; break;
        case 'replay': startGame(S.players.length || S.count); break;
        case 'log': sheet = 'log'; break;
        case 'closelog': sheet = null; break;
        case 'godes':      // depuis l'accueil tableau -> mode dés
        MODE = 'des'; saveMode();
        if (!DS.screen || DS.screen === 'setup-des') DS.screen = 'setup-des';
        break;
      case 'desresume':  // reprendre la partie aux dés en cours
        MODE = 'des'; saveMode();
        DS.screen = 'game-des';
        saveDes();
        break;
      case 'new':
          if (S.winner !== null || confirmNew) {
            confirmNew = false; S.count = S.players.length || S.count; S.screen = 'setup'; msg = null; sheet = null;
          } else {
            confirmNew = true; clearTimeout(confirmTimer);
            confirmTimer = setTimeout(() => { confirmNew = false; render(); }, 3000);
          }
          break;
      }
    }

    save(); render();
    if (moved) scrollToActive();
  }

  // ---- Rendering ---------------------------------------------------------
  const ICON = {
    undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
    redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>',
    sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'

  function viewSetup() {
    const counts = [2, 3, 4, 5, 6].map(n =>
      `<button data-a="count" data-v="${n}" aria-pressed="${S.count === n}">${n}</button>`).join('');
    const resume = resumable();
    const lead = S.players.slice(0, 4).map((p, i) =>
      `${esc(S.names[i] || 'Joueur ' + (i + 1))} ${fmt(p.score)}`).join(' · ');
    const leadDes = DS.players.slice(0, 4).map((p, i) =>
      `${esc(DS.names[i] || 'Joueur ' + (i + 1))} ${fmt(p.score)}`).join(' · ');
    return `<div class="app"><div class="setup">
      <h1>20K <span>Scorecard</span></h1>

      </button>` : ''}
      ${resume ? `<button class="resume" data-a="resume">
        <span class="rt"><b>Reprendre la partie en cours</b>
        <small>${lead}${S.players.length > 4 ? ' …' : ''}</small></span>${ICON.chev}
      </button>` : ''}
      <div><h2>Nombre de joueurs</h2><div class="count">${counts}</div></div>
      <ul class="rules">
        <li>Premier score : <b>${fmt(MIN_OPEN)}</b> minimum</li>
        <li>Vol permis à partir de <b>${fmt(MIN_VOL)}</b></li>
        <li>Objectif exact : <b>${fmt(TARGET)}</b></li>
      </ul>
      <button class="go${confirmStart ? ' danger' : ''}" data-a="start">${confirmStart ? 'Remplacer la partie en cours ?' : resume ? 'Nouvelle partie' : 'Commencer le jeu'}</button>
