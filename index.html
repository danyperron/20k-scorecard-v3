  }

  // ---- Mode dés : rendu ---------------------------------------------------
  function dGlyph(v) { return DICE_GLYPH[v] || String(v); }

  // Une face de dé « réaliste » : grille 3×3 de points disposés comme un vrai dé.
  // PIPS[v] = couples [ligne, colonne] où poser un point (0-indexé).
  const PIPS = {
    1: [[1, 1]],
    2: [[0, 0], [2, 2]],
    3: [[0, 0], [1, 1], [2, 2]],
    4: [[0, 0], [0, 2], [2, 0], [2, 2]],
    5: [[0, 0], [0, 2], [1, 1], [2, 0], [2, 2]],
    6: [[0, 0], [1, 0], [2, 0], [0, 2], [1, 2], [2, 2]]
  };
  function dFace(v, pip) {
    const dots = PIPS[v] || [];
    const on = (r, c) => dots.some(([R, C]) => R === r && C === c);
    let cells = '';
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const filled = (v >= 1 && v <= 6) && on(r, c);
        cells += `<i class="pip${filled ? '' : ' off'}"></i>`;
      }
    }
    return `<span class="face"${pip ? ' style="--pip:' + pip + '"' : ''}>${cells}</span>`;
  }

  // Affiche un dé : « tenu » (points colorés par jet), « gris » (à relancer /
  // perdant) avec des points éteints.
  function dDie(v, kept, color) {
    return `<span class="die ${kept ? 'kept' : 'gray'}">${dFace(v, kept ? color : '')}</span>`;
  }

  // Affiche les dés : « tenus » (des jets antérieurs, colorés par jet) puis le
  // « lancer courant » (gardés = couleur du jet, à relancer = gris).
  // En idle (aucun lancer), on affiche un plateau fixe de 6 dés gris pour que
  // l'interface reste stable. En état perdu : les dés sans valeur en gris.
  function diceRow(st) {
    const die = (d) => d.kept
      ? dDie(d.v, true, jetColor(d.jet))
      : dDie(d.v, false, '');
    // Idle : plateau fixe de 6 dés (fenêtre identique au lancer). On montre des
    // faces 1→6 atténuées pour qu'on reconnaisse de vrais dés avant de lancer.
    if (!st) {
      const cells = [1, 2, 3, 4, 5, 6].map(v => dDie(v, false, '')).join('');
      return `<div class="dgrid"><div class="dgroup"><small>6 dés — appuie sur Lancer pour débuter</small><div class="div">${cells}</div></div></div>`;
    }
    const perdu = st.type === 'perdu';
    if (perdu) {
      const keptByJet = (DS.keptByRoll || []).reduce(
        (acc, g) => acc.concat((g.dice || []).map(v => ({ v, jet: g.jet, kept: true }))), []);
      const lost = (st.handLost || []).map(v => ({ v, jet: 0, kept: false }));
      let html = '';
      if (keptByJet.length) html += `<div class="dgroup"><small>Dés tenus</small><div class="div">${keptByJet.map(die).join('')}</div></div>`;
      if (lost.length) html += `<div class="dgroup"><small>Lancer perdant (aucun point)</small><div class="div">${lost.map(die).join('')}</div></div>`;
      return `<div class="dgrid">${html}</div>`;
    }
    if (st.type !== 'rolling') return '';
    const curJet = st.lancers || 1;
    const keptCur = (st.kept || []);
    const current = (st.inHand || []).map(v => ({ v, jet: curJet, kept: keptCur.includes(v) }));
    const keptByJet = (DS.keptByRoll || []).reduce(
      (acc, g) => acc.concat((g.dice || []).map(v => ({ v, jet: g.jet, kept: true }))), []);
    let html = '';
    if (keptByJet.length) html += `<div class="dgroup"><small>Dés tenus (${keptByJet.length})</small><div class="div">${keptByJet.map(die).join('')}</div></div>`;
    html += `<div class="dgroup"><small>Lancer n°${curJet}</small><div class="div">${current.map(die).join('')}</div></div>`;
    if (!current.length && !keptByJet.length) return '';
    return `<div class="dgrid">${html}</div>
      ${dHint(st) ? `<p class="dhint">${dHint(st)}</p>` : ''}`;
  }

  function dHint(st) {
    if (st.allScored) return 'Tous les dés ont rapporté : on relance les 6 dés.';
    const n = (st.toRoll || []).length;
    if (n === 0) return '';
    return n + ' dé' + (n > 1 ? 's' : '') + ' à relancer';
  }

  function viewRowDes(p, i) {
    const active = i === DS.current && DS.winner === null;
    const won = i === DS.winner;
    const rem = DES_TARGET - p.score;
    return `<section class="row${active ? ' active' : ''}${won ? ' won' : ''}" id="drow-${i}">
      <div class="who">
        <div class="namewrap"><span class="dot"></span>
          <input class="name" id="dname-${i}" data-dname="${i}" value="${esc(DS.names[i])}" aria-label="Nom du joueur ${i + 1} (dés)" autocomplete="off"></div>
        <div class="meta">
          ${p.last !== null ? `<span class="last">Dernier : +${fmt(p.last)}</span>` : ''}
          ${rem < DES_TARGET ? `<span class="hint">Reste ${fmt(rem)}</span>` : `<span class="hint">Objectif ${fmt(DES_TARGET)}</span>`}
        </div>
      </div>
      <div class="nums">
        <div class="num"><small>Points</small><b>${fmt(p.score)}</b></div>
        <div class="num rem"><small>Restant</small><b>${won ? 'Gagnant!' : fmt(rem)}</b></div>
      </div>
    </section>`;
  }

  // Panneau du bas (plateau de dés) — interface fixe : même structure dans tous
  // les états (idle, lancer, vol, perdu). Le bouton principal du haut lance ou
  // relance les dés ; le bouton du bas encaisse ; sur une perte on passe au suivant.
  function dPanel() {
    const st = DS.turn;               // TurnDice state ou null (idle)
    const p = DS.players[DS.current];
    const playerName = esc(DS.names[DS.current]);
    const currentPhase = DS.phase;
    const isIdle = !st;
    const isSteal = currentPhase === 'steal';
    const nextName = DS.names.length ? esc(DS.names[dNext(DS.current)]) : '';

    // En-tête commun + bouton principal (haut à droite, coloré) + badge « dés à tirer ».
    // Nombre de dés qu'on va relancer : les non gardés du lancer courant ; en
    // main pleine (allScored) on relance les 6.
    let diceLeft = 0;
    let topBtn, topLabel, topAction;
    if (isIdle) {
      if (dVolOffer()) {
        // Un vol est possible : c'est l'action principale, en évidence.
        topLabel = `🔓 Voler ${fmt(DS.prevTurn.gain)}`;
        topAction = 'volerd';
        const ld = DS.prevTurn.leftoverDice;
        diceLeft = (ld && ld.length) ? ld.length : 6;   // 6 dés si rien n'a été laissé
      } else {
        topLabel = '🎲 Lancer les dés';
        topAction = 'lancier';
        diceLeft = 6;
      }
    } else if (st.type === 'perdu') {
      topLabel = '';
      topAction = '';
    } else {
      topLabel = '🎲 Relancer les dés';
      topAction = 'rolldes';
      diceLeft = st.allScored ? 6 : ((st.toRoll || []).length);
    }
    const diceBadge = topAction
      ? `<span class="diceleft" style="color:${dieValueColor(diceLeft)};border-color:${dieValueColor(diceLeft)};background:${dieValueColor(diceLeft)}1f" title="Nombre de dés qui seront lancés">${diceLeft} dés</span>`
      : '';
    topBtn = topAction
      ? `<div class="topctr">${diceBadge}<button class="reroll ${topAction === 'volerd' ? 'vol' : ''}" data-a="${topAction}" ${st && st.type !== 'rolling' ? 'disabled' : ''}>${topLabel}</button></div>`
      : '';

    // Total + état du tour. Pendant un vol, le total du tour = gain volé + production.
    const totalShown = isIdle ? 0
      : st.type === 'perdu' ? 0
      : isSteal ? (DS.steal.gainToSteal + (st.score || 0))
      : (st.score || 0);
    const label1 = isIdle ? 'Au tour de' : 'Tour de';
    const stateTxt = isIdle
      ? `<div class="dstate">Joueur prêt à lancer.</div>`
      : (st.type === 'perdu' ? `<div class="dstate"><b>${playerName}</b> a perdu ce tour (aucun point).</div>`
        : st.type === 'rolling' ? `<div class="dstate">${isSteal
            ? `<b>Vol</b> — dés restants de ${esc(DS.names[DS.steal.sourcePlayer])} · gain ${fmt(DS.steal.gainToSteal)} à copier · produis au moins ${fmt(DES_VOL_MIN_PROD)}.`
            : `<b>Lancer n°${st.lancers}</b> · ${p.score > 0
                ? 'encaissable dès 1 point'
                : 'premier score : ' + fmt(T.OUVRAGE) + ' minimum'}.`}</div>`
        : `<div class="dstate"><b>${playerName}</b> encaisse ${fmt(st.total)}.</div>`);

    // Bandeau « main pleine ».
    const allScoredBanner = (st && st.type === 'rolling' && st.allScored)
      ? `<div class="dmsg good">🎲 Tous les dés ont rapporté : relance les 6 dés (le total du tour augmentera).</div>` : (isIdle && dVolOffer())
      ? `<div class="dmsg good">🔓 Vol possible : partir des dés restants de <b>${esc(DS.names[DS.prevTurn.player])}</b> (gain ${fmt(DS.prevTurn.gain)} à copier).</div>`
      : '';

    // Seuil d'encaissement : 1000 seulement pour le PREMIER score d'un joueur ;
    // ensuite il peut encaisser son tour dès 1 point.
    const openReq = isSteal ? DES_VOL_MIN_PROD : (p.score > 0 ? 1 : T.OUVRAGE);

    // Bouton(s) du bas.
    let bottom;
    if (isIdle) {
      const offer = dVolOffer();
      // Le bouton principal du haut gère le vol (s'il est possible) ou le lancer.
      // En bas, on propose l'autre option : lancer normalement (si le haut vole).
      if (offer && topAction === 'volerd') {
        bottom = `<div class="actions"><button class="act ok" data-a="lancier">Lancer les 6 dés (sans voler)</button></div>`;
      } else {
        bottom = '';
      }
    } else if (st.type === 'perdu') {
      bottom = `<button class="act slate" style="width:100%" data-a="dasser">Passer à ${nextName}</button>`;
    } else {
      const canTake = st.type === 'rolling' && st.score >= openReq;
      const stopLabel = isSteal ? 'Prendre le vol' : 'Arrêter & encaisser';
      const canTakeHint = (st.type === 'rolling' && !canTake)
        ? `<p class="dhint">${isSteal ? 'Il faut ' + fmt(DES_VOL_MIN_PROD) + ' points produits pour encaisser le vol.'
            : (p.score > 0 ? 'Tu peux encaisser dès 1 point — appuie sur Relancer ou Arrêter.'
              : 'C\'est ton premier score : il faut '+fmt(T.OUVRAGE)+' points pour pouvoir encaisser.')}</p>` : '';
      bottom = `${canTakeHint}
        <div class="actions"><button class="act ok" data-a="stopdes" ${canTake ? '' : 'disabled'}>${stopLabel}</button></div>`;
    }

    return `<footer class="panel" id="panel">
      ${msg ? `<div class="msg ${msg.kind}" role="alert">${ICON.info}<div><strong>${esc(msg.title)}</strong>${esc(msg.text)}</div></div>` : ''}
      <div class="dice-wrap">
        <div>
          <div class="label">${label1} <b>${playerName}</b></div>
          <div class="dturn">
            <span class="dlab">Tour</span><span class="damt">${fmt(totalShown)}</span>
            ${st && st.type === 'rolling' && st.gained ? `<span class="dgain">(+${fmt(st.gained)} ce lancer)</span>` : ''}
          </div>
          ${stateTxt}
        </div>
        ${topBtn}
      </div>
      ${allScoredBanner}
      ${diceRow(st)}
      ${(isIdle && !dVolOffer()) ? `<p class="dsub">Tu as ${fmt(DES_TARGET - p.score)} points · objectif ${fmt(DES_TARGET)}.</p>` : ''}
      ${bottom}
    </footer>`;
  }

  function viewGameDes() {
    const w = DS.winner;
    return `<div class="app">
      <header class="top">
        <h1>20K <span>Dés</span></h1>
        <div class="tools">
          <button class="tool" data-a="deslog" aria-label="Exporter l'historique des jets" title="Exporter jets">Historique</button>
          <button class="tool sound" data-a="sound" aria-label="${S.sound === false ? 'Activer le son' : 'Couper le son'}" title="${S.sound === false ? 'Son coupé' : 'Son activé'}">${S.sound === false ? ICON.mute : ICON.sound}</button>
          <button class="tool" data-a="desnew" title="Nouvelle partie aux dés">Nouveau</button>
        </div>
      </header>
      ${w !== null ? `<div class="win">
        <h2>🏆 ${esc(DS.names[w])} gagne avec ${fmt(DS.players[w].score)} points!</h2>
        <div class="btns">
          <button class="replay" data-a="start">Rejouer</button>
          <button class="fresh" data-a="desnew">Nouveau jeu</button>
        </div></div>` : ''}
      <main class="list">${DS.players.map(viewRowDes).join('')}</main>
      ${w === null ? dPanel() : ''}
      ${DS.jetLog.length ? `<details class="des-log" open><summary>Jets (${DS.jetLog.length}) · derniers en haut</summary>
        <p class="dloghead">Partie #${DS.gameId} · version ${esc(VERSION)} · du plus récent au plus ancien</p>
        ${DS.jetLog.slice().reverse().map(e => {
          const nm = esc(DS.names[e.p] || `Joueur ${e.p + 1}`);
          const kindLabel = e.kind === 'bank' ? 'ENC.' : e.kind === 'vol-bank' ? 'VOL ENC.' : e.kind === 'perdu' ? 'PERDU' : 'jet';
          const comb = e.comb ? ` · ${esc(e.comb)}` : '';
          const cls = e.kind === 'perdu' ? ' none' : (e.kind === 'bank' || e.kind === 'vol-bank') ? ' vol' : ' lv';
          const c = e.color || '#999';
          const dice = (e.dice || []).map(d => `<span style="color:${c}">${dGlyph(d)}</span>`).join(' ');
          return `<div class="djetrow"><span class="ln">T${e.n || 0}.${e.j > 0 ? e.j : ''}</span>
            <span class="lnm">${nm}</span>
            <span class="ddice-mini">${dice || '·'}</span>
            <span class="lv${cls}">${kindLabel} ${fmt(e.gained || 0)}${comb}</span>
            <span class="ls">= ${fmt(e.cumul || 0)}</span></div>`;
        }).join('')}</details>` : ''}
    </div>`;
  }

  // Détail (lecture seule) d'une partie terminée : gagnant + scores, sans pouvoir jouer.
  function viewDesHist() {
    const i = DS.histView;
    const g = (i >= 0 && DS.stats[i]) ? DS.stats[i] : null;
    if (!g) { DS.screen = 'setup-des'; return viewSetupDes(); }
    const date = new Date(g.ts).toLocaleDateString('fr-CA', { day: 'numeric', month: 'long', year: 'numeric' });
    const win = g.winner >= 0 ? g.names[g.winner] : '?';
    const winIdx = g.winner;
    const rows = g.players.map((p, pl) => {
      const won = pl === winIdx;
      const place = { 0: '🥇', 1: '🥈', 2: '🥉' }[pl] || (pl + 1) + 'e';
      return `<section class="row${won ? ' won' : ''}">
        <div class="who"><div class="namewrap"><span class="dot"></span><span class="name">${esc(g.names[pl] || 'J' + (pl + 1))}</span></div>
          <div class="meta">${place}</div></div>
        <div class="nums"><div class="num"><small>Points</small><b>${fmt(p.score)}</b></div>
          <div class="num rem"><small>${won ? 'Gagnant 🏆' : 'Restant'}</small><b>${won ? '' : fmt(DES_TARGET - p.score)}</b></div></div>
      </section>`;
    }).join('');
    return `<div class="app"><div class="ogame">
      <div class="top"><button class="tool" data-a="backhist">← Retour</button>
        <span class="rcode small"><b>#${g.g || i + 1}</b></span></div>
      <h1>20K <span>aux dés</span></h1>
      <div class="dmsg good">🏆 <b>${esc(win)}</b> a gagné — ${date} · ${g.jets} jet${g.jets === 1 ? '' : 's'}</div>
      <div class="rows">${rows}</div>
      <button class="act slate" style="width:100%;margin-top:10px" data-a="backhist">← Retour à l'accueil</button>
      <p class="version">Partie terminée — historique</p>
    </div></div>`;
  }

  function viewSetupDes() {
    const resumableDes = () => DS.players.length > 0 && DS.winner === null;
    const resume = resumableDes();
    const lead = DS.players.slice(0, 4).map((p, i) =>
      `${esc(DS.names[i] || 'Joueur ' + (i + 1))} ${fmt(p.score)}`).join(' · ');
    const sel = DS.selected = (DS.selected || []).filter(id => findPlayer(id));
    // Sélection des joueurs du répertoire.
    let playersHtml;
    if (!roster.players.length) {
      playersHtml = `<div class="roster-empty">Aucun joueur enregistré.
        <button class="act slate" data-a="roster">Créer des joueurs</button></div>`;
    } else {
      const chips = roster.players.map(p => {
        const on = sel.includes(p.id);
        return `<button class="pchip${on ? ' on' : ''}" data-a="togsel" data-v="${esc(p.id)}" aria-pressed="${on}">
          <span class="avat" style="background:${p.color}">${esc((p.name[0] || '?').toUpperCase())}</span>
          <span class="pnm">${esc(p.name)}</span>
          <span class="pstat">${p.stats.wins} 🏆 · ${p.stats.points ? fmt(p.stats.points) : 0} pts</span>
        </button>`;
      }).join('');
      playersHtml = `<div class="pchips">${chips}</div>
        <button class="linkbtn" data-a="roster">Gérer les joueurs · statistiques</button>`;
    }
    const goDisabled = sel.length < 2;
    return `<div class="app"><div class="setup">
      <h1>20K <span>aux dés</span></h1>
      ${resume ? `<button class="resume" data-a="dresume">
        <span class="rt"><b>Reprendre la partie en cours</b>
        <small>${lead}${DS.players.length > 4 ? ' …' : ''}</small></span>${ICON.chev}
      </button>` : ''}
      ${DS.stats.length ? `<div class="past"><h2>Parties terminées (cet appareil)</h2>
        ${DS.stats.slice().reverse().map((g, ri) => {
          const idx = DS.stats.length - 1 - ri;
          const date = new Date(g.ts).toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' });
          const winName = esc(g.names[g.winner] || '?');
          const scores = g.players.map((p, i) => `${esc(g.names[i] || 'J')} ${fmt(p.score)}`).join(' · ');
          return `<button class="pastrow" data-a="detview" data-v="${idx}">
            <span class="rt"><b>🏆 ${winName}</b><small>${date} · ${scores} · ${g.jets} jet${g.jets===1?'':'s'} — voir le détail</small></span>${ICON.chev}
          </button>`;
        }).join('')}</div>`
      : ''}
      ${DS.stats.length ? '' : ''}
      <div><h2>Joueurs de la partie <span class="cnt">${sel.length}</span></h2>${playersHtml}</div>
      <ul class="rules">
        <li>6 dés : garde les dés qui rapportent, relance le reste</li>
        <li>Ouverture <b>${fmt(1000)}</b> avant de pouvoir encaisser</li>
        <li>Vol permis à partir de <b>${fmt(3500)}</b></li>
        <li>Objectif exact : <b>${fmt(20000)}</b></li>
      </ul>
      <button class="go" data-a="start" ${goDisabled ? 'disabled' : ''}>Commencer la partie (${sel.length} joueur${sel.length===1?'':'s'})</button>
      <button class="act slate" data-a="online" style="width:100%">🌐 Jouer en ligne (parties & historique en ligne)</button>
      <button class="linkbtn" style="margin-top:6px" data-a="ostats">📊 Mes parties terminées en ligne</button>
      <p class="version">Version ${VERSION}</p>
    </div></div>`;
  }

  function viewRoster() {
    const row = p => `<div class="prow">
        <span class="avat" style="background:${p.color}">${esc((p.name[0] || '?').toUpperCase())}</span>
        <div class="pinfo"><b>${esc(p.name)}</b>
          <small>${p.stats.games} partie${p.stats.games===1?'':'s'} · ${p.stats.wins} vi${p.stats.wins===1?'ctoire':'ctoires'} · ${fmt(p.stats.points)} pts cumulés</small></div>
        <div class="pops">
          ${p.stats.wins ? `<span class="trophy">🏆</span>` : ''}

      <button class="linkbtn" style="margin-top:10px" data-a="backdes">← Retour à l\'accueil</button>
      <p class="version">Version ${VERSION}</p>
    </div></div>`;

    const cur = editingColor || PLAYER_COLORS[0];
    const swatches = PLAYER_COLORS.map(c =>
      `<span class="sw${c === cur ? ' on' : ''}" data-a="setcolor" data-v="${c}" style="background:${c}"></span>`).join('');
    return `<div class="peditor">
      <input type="text" id="p-name" value="${esc(editingName || '')}" placeholder="Nom du joueur" maxlength="18">
      <div class="pcolors">${swatches}</div>
      <div class="pbtns">

    </div>`;

  function viewRow(p, i) {
    const active = i === S.current && S.winner === null;
    const won = i === S.winner;
    return `<section class="row${active ? ' active' : ''}${won ? ' won' : ''}" id="row-${i}">
      <div class="who">
        <div class="namewrap"><span class="dot"></span>
          <input class="name" id="name-${i}" data-name="${i}" value="${esc(S.names[i])}" aria-label="Nom du joueur ${i + 1}" autocomplete="off"></div>
        <div class="meta">
          ${p.last !== null ? `<span class="last">Dernier : +${fmt(p.last)}</span>` : ''}
          ${!p.started ? `<span class="hint">Minimum ${fmt(MIN_OPEN)} pour commencer</span>` : ''}
        </div>
      </div>
      <div class="nums">

        <div class="num rem"><small>Restant</small><b>${won ? 'Gagnant!' : fmt(TARGET - p.score)}</b></div>
      </div>
    </section>`;
  }

  function viewPanel() {
    const t = S.turn, total = t.stolen + t.add, vol = E.canVol(S);
    const p = S.players[S.current];
    const volTitle = E.volReason(S);
    const turnHtml = t.stolen
      ? `<span class="stolen">${ICON.lock}<small>VOL</small>${fmt(t.stolen)}</span>

      })

}
  // Récupère la liste des parties OUVERTES (via HTTP GET /parties, comme le worker CF).
  // En dev, repli WebSocket « getParties » si le fetch échoue.
  function olFetchParties() {
    if (typeof fetch === 'function') {
      fetch(olHttpBase() + '/parties')
        .then(r => r.json().then(d => ({ ok: r.ok, d })).catch(() => ({ ok: false })))
        .then(({ ok, d }) => {
          const list = (ok && d && Array.isArray(d.parties)) ? d.parties : null;
          if (list) { OL.parties = list; render(); }
          else if (OL.ws && OL.ws.readyState === 1) olSend({ type: 'getParties' });
        })
        .catch(() => { if (OL.ws && OL.ws.readyState === 1) olSend({ type: 'getParties' }); });
      return;
    }
    if (OL.ws && OL.ws.readyState === 1) olSend({ type: 'getParties' });
  }
  let partyPollTimer = 0;
  function olStartPartyPoll() {
    if (partyPollTimer) return;

    partyPollTimer = setInterval(olFetchParties, 3000);
  }
  function olStopPartyPoll() {
    if (partyPollTimer) { clearInterval(partyPollTimer); partyPollTimer = 0; }
  }
  function refreshMyTurn() {
    if (!OL.g) { OL.myTurn = false; return; }
    OL.myTurn = (OL.myIndex === OL.g.current) && OL.g.winner === null;
    // Si ce n'est plus notre tour (ou partie passée), on nettoie l'état local d'un vol/lancer
    // pour éviter qu'un vol « en cours » fantôme ne s'affiche au prochain tour (bug cellulaire).
    if (!OL.myTurn) {
      OL.stealSource = -1; OL.stealGain = 0;
      // on garde turnProxy seulement si on est en plein lancer et que c'est notre tour ; ici on le nettoie.
    }
    if (OL.g.winner !== null) OL.stealSource = -1;
  }
  function onlineCount() { return OL.members.filter(m => m.online !== false).length; }
  // Empêche de choisir un joueur DÉJÀ présent dans la partie (évite 2 fois la même personne).
  // L'identité « Mon joueur » sélectionnée (~pon tant pid que nom) ne doit pas déjà être membre.
  function olCheckDuplicate() {
    const prof = OL.profile;
    if (!prof) return;
    const p = findPlayer(prof.id);
    const myName = p ? p.name : (prof.name || '');
    const dup = (OL.members || []).some(m => m.index !== OL.myIndex && (
      (typeof m.pid === 'number' && m.pid != null && prof.id != null && String(m.pid) === String(prof.id))
      || (m.name && myName && m.name.toLowerCase() === myName.toLowerCase())
    ));
    if (dup) {
      OL.error = 'Ce joueur est déjà dans la partie. Choisissez un autre joueur ou quittez.';
      OL.keepError = true;   // ne pas laisser le onclose écraser ce message
      olDisconnect();
      DS.screen = 'ojoin';   // revenir au choix du joueur pour que le message s'affiche
      render();
    }
  }
  // Le passage du Lobby à la partie ne se fait que quand le SERVEUR a 'started' :
  // on attend dans le lobby que l'hôte appuie sur « Débuter » (plus de 2 joueurs possibles).
  function maybeStart() {
    if (OL.g && OL.g.started) { DS.screen = 'ogame'; return; }
    // en pré-lancement on reste sur le lobby (host) tant que non démarré
    if (DS.screen === 'ogame' && OL.g && !OL.g.started && !OL.g.players.some(p => p.score > 0)) DS.screen = 'host';
  }
  // ---- Actions en ligne ----
  function oDo(action, v) {
    switch (action) {
      case 'online': OL.order = ''; OL.error = ''; OL.pendingReq = false; DS.screen = 'ojoin'; olInitProfile(); olStartPartyPoll(); render(); break;
      case 'ocreate': OL.error = ''; if (!olHaveProfile()) { OL.error = 'Sélectionnez votre joueur (Mon joueur) avant de créer.'; render(); break; } olConnect('create'); break;
      case 'ojoin': OL.error = ''; if (!olHaveProfile()) { OL.error = 'Sélectionnez votre joueur (Mon joueur) avant de rejoindre.'; render(); break; } olConnect('join'); break;
      case 'ojoincode': OL.error = ''; if (!olHaveProfile()) { OL.error = 'Sélectionnez votre joueur (Mon joueur) avant de rejoindre.'; render(); break; }
        OL.order = String(v == null ? '' : v).slice(0, 4); OL.error = ''; olConnect('join'); break;
      case 'ocodetoggle': OL.showCodeInput = !OL.showCodeInput; render(); break;
      case 'opendingleave': olDisconnect(); DS.screen = 'setup-des'; break;
      case 'oaccept': {   // l'HÔTE accepte un joueur en attente (v = rs)
        if (OL.myIndex !== 0) break;
        OL.error = ''; olSend({ type: 'accept', rs: Number(v) }); break; }
      case 'orefuse': {   // l'HÔTE refuse un joueur en attente (v = rs)
        if (OL.myIndex !== 0) break;
        OL.error = ''; olSend({ type: 'refuse', rs: Number(v) }); break; }
      case 'orejoin': {  // reprendre une partie interrompue (code mémorisé)
        if (!olHaveProfile()) { OL.error = 'Sélectionnez votre joueur (Mon joueur) avant de reprendre.'; render(); break; }
        const saved = olSavedRoom();
        if (saved) { OL.order = saved; OL.error = ''; olConnect('join'); }
        break; }
      case 'oinput': OL.order = String(v == null ? '' : v).slice(0, 4); break;
      case 'logtoggle': OL.logAll = !OL.logAll; render(); break;
      case 'oleave': olDisconnect(); olStopPartyPoll(); DS.screen = 'setup-des'; break;
      case 'ostart': {  // l'hôte démarre la partie depuis le lobby
        if (OL.myIndex !== 0) break;
        OL.error = '';
        olSend({ type: 'action', seq: ++OL.lastSeq, act: { type: 'start' } });
        break; }
      case 'orestart': {  // nouvelle partie avec les mêmes joueurs (tirage au sort)
        if (OL.myIndex !== 0) break;
        OL.error = '';
        olSend({ type: 'action', seq: ++OL.lastSeq, act: { type: 'restart' } });
        break; }
      case 'ostats': DS.screen = 'ostats'; OL.error = ''; olEnsureConn(); break;
      case 'osetp': { const p = findPlayer(String(v)); olSetProfile(p); render(); break; }
      case 'obank': {  // le joueur actif encaisse depuis son tour local (normal ou vol)
        const t = OL.turnProxy;
        if (!t || !OL.myTurn) break;
        const isSteal = OL.stealSource >= 0;
        OL.turnProxy = null;
        const totalDice = (t.kept || []).length + (t.toRoll || []).length;
        olSend({ type: 'action', seq: ++OL.lastSeq,
          act: { type: 'bank', production: t.score || 0, gain: isSteal ? (OL.stealGain || 0) : 0,
            leftoverDice: (t.toRoll || []).slice(), diceUsed: totalDice } });
        OL.stealGain = 0; OL.stealSource = -1; OL.myTurn = false;
        break;
      }
      case 'olost': {  // le joueur actif perd son tour
        const tl = OL.turnProxy;
        OL.turnProxy = null;
        olSend({ type: 'action', seq: ++OL.lastSeq,
          act: { type: 'lost', diceUsed: tl ? ((tl.kept || []).length + (tl.toRoll || []).length) : 0 } });
        OL.myTurn = false;
        break;
      }
      case 'oroll': {  // le joueur actif lance / relance ses dés localement
        let prev;
        if (!OL.turnProxy) { OL.turnProxy = T.start(T.fresh()); OL.keptByRoll = []; }
        else {
          const prevAllScored = !!OL.turnProxy.allScored;
          const prevKept = (OL.turnProxy.kept || []);
          const prevJet = OL.turnProxy.lancers || 1;
          OL.turnProxy = T.roll(OL.turnProxy);
          // Les dés qui rapportent du jet précédent deviennent « tenus ».
          if (prevAllScored) OL.keptByRoll = [];
          else if (prevKept.length) OL.keptByRoll.push({ jet: prevJet, dice: prevKept });
        }
        // Relaie le tour courant pour que les autres voient le déroulé (dés + total).
        olSend({ type: 'action', seq: ++OL.lastSeq, act: { type: 'turn', turn: OL.turnProxy, keptByRoll: OL.keptByRoll.slice() } });
        break;
      }
      case 'orollall': {  // tout relancer (6 dés) : garde les points cumulés du tour
        if (!OL.turnProxy) break;
        OL.turnProxy = T.roll(OL.turnProxy, T.rollN(T.DES || 6));
        OL.keptByRoll = [];
        olSend({ type: 'action', seq: ++OL.lastSeq,
          act: { type: 'turn', turn: OL.turnProxy, keptByRoll: OL.keptByRoll.slice() } });
        break;
      }
      case 'ovol': {  // le joueur actif démarre un vol (relance les dés du précédent)
        const vt = OL.g && OL.g.prevTurn;
        if (!vt || !OL.myTurn || OL.turnProxy) break;
        const hand = (vt.leftoverDice && vt.leftoverDice.length) ? vt.leftoverDice : undefined;
        OL.turnProxy = T.start(T.fresh(), hand);
        OL.keptByRoll = []; OL.stealGain = vt.gain || 0; OL.stealSource = vt.player;
        olSend({ type: 'action', seq: ++OL.lastSeq, act: { type: 'voloff', turn: OL.turnProxy } });
        break;
      }
    }
    render();   // réaffiche immédiatement après toute action en ligne (le serveur confirmera ensuite)
  }

            ? `<button class="act ok" data-a="orestart">♻️ Nouvelle partie (mêmes joueurs)</button>
               <button class="act slate" style="margin-top:6px" data-a="oleave">Quitter la partie</button>`
            : `<button class="act slate" data-a="oleave">Quitter la partie</button>`}
        </div>` : '';
    return `<div class="app"><div class="ogame">
      <div class="top"><button class="tool" data-a="oleave">← Quitter</button>
        <span class="rcode small"><b>#${esc(OL.code)}</b></span></div>
      <h1>20K <span>en ligne</span></h1>
      ${orderBanner}
      ${banner}
      ${g.winner !== null ? endBar : ''}
      <div class="rows">${rows}</div>
      ${g.winner !== null ? '' : turnArea}
      ${journal}
      <p class="version">Partie #${esc(OL.code)}</p>
    </div></div>`;
  }
  function viewOMyTurn() {
    // Le joueur actif joue son tour avec le moteur de dés local.
    olReseat();   // s'assurer que myIndex correspond bien à notre siège avant d'afficher
    const myScore = (OL.g && OL.g.players && OL.g.players[OL.myIndex]) ? OL.g.players[OL.myIndex].score : 0;
    const die = (d) => d.kept ? dDie(d.v, true, jetColor(d.jet)) : dDie(d.v, false, '');
    const inSteal = OL.stealSource >= 0;

    // Pas encore lancé (idle) : proposer de voler (si éligible) ou de lancer normalement.
    if (!OL.turnProxy) {
      const vt = OL.g && OL.g.prevTurn;
      const canOffer = OL.myTurn && vt && vt.gain > 0 && vt.player !== OL.g.current
        && myScore >= T.VOL_PASSEPORT && T.canVol(myScore, vt.gain, 0, DES_TARGET);
      const ld = vt && vt.leftoverDice;
      const volDice = (ld && ld.length) ? ld.length : 6;
      // Texte de l'offre réduit : on n'affiche plus le bandeau « Vol possible : partir des
      // dés restants de X — gain Y à copier » (superflu), mais on montre le nb de dés sur
      // le bouton « Voler Y (n dés) ».
      return `<div class="dgrid"><div class="dgroup"><small>Prêt à lancer</small>
        <div class="div">${[1,2,3,4,5,6].map(v => dDie(v, false, '')).join('')}</div></div></div>
        <div class="actions" style="grid-template-columns:${canOffer ? '1fr 1fr' : '1fr'};margin-top:8px">
          ${canOffer ? `<button class="act purple" data-a="ovol">🔓 Voler ${fmt(vt.gain)} (${volDice} dés)</button>` : ''}
          <button class="act ok" data-a="oroll">🎲 Lancer les dés</button>
        </div>`;
    }

    const tp = OL.turnProxy;
    const perdu = tp.type === 'perdu';
    const curJet = tp.lancers || 1;
    const keptCur = (tp.kept || []);
    const current = (tp.inHand || []).map(v => ({ v, jet: curJet, kept: keptCur.includes(v) }));
    // Dés tenus des jets antérieurs (colorés par jet).
    const keptHtml = (OL.keptByRoll || []).reduce((acc, g) =>
      acc.concat((g.dice || []).map(v => ({ v, jet: g.jet, kept: true }))), []);
    // Nombre de dés qu'on va relancer : non gardés du lancer courant, ou 6 si tout a rapporté.
    const diceLeft = tp.allScored ? 6 : ((tp.toRoll || []).length);
    let cells = '';
    if (perdu) {
      const lost = (tp.handLost || []).map(v => ({ v, jet: 0, kept: false }));
      cells = `<div class="dgroup"><small>Lancer perdant (aucun point)</small><div class="div">${lost.map(die).join('')}</div></div>`;
    } else {
      const keptBlock = keptHtml.length
        ? `<div class="dgroup"><small>Dés tenus (${keptHtml.length})</small><div class="div">${keptHtml.map(die).join('')}</div></div>` : '';
      const sense = inSteal ? 'Vol · ' : '';
      const comb = (tp.combinaison && tp.combinaison !== 'unités') ? ` · <b>${esc(tp.combinaison)}</b>` : '';
      const hint = tp.allScored ? `<p class="dhint">Tous les dés ont rapporté : on relance les 6.</p>`
        : (diceLeft > 0 ? `<p class="dhint">${fmt(diceLeft)} dé${diceLeft > 1 ? 's' : ''} à relancer</p>` : '');
      cells = `${keptBlock}
        <div class="dgroup"><small>${sense}Lancer n°${curJet} · ${fmt(tp.gained || 0)} points${comb}</small><div class="div">${current.map(die).join('')}</div></div>
        ${tp.score >= 0 ? `<p class="dturn"><span class="dlab">Total du tour</span><span class="damt">${fmt(tp.score)}</span>
          ${inSteal ? `<span class="dgain">(+ ${fmt(OL.stealGain || 0)} volés)</span>` : ''}</p>` : ''}
        ${hint}`;
    }
    const restant = DES_TARGET - myScore;
    // On ne peut pas encaisser plus que le restant (il faut atteindre 20000 pile).
    // Si le jet dépasse, on affiche « trop » et on ne permet PAS d'encaisser (on passe).
    const trop = !perdu && !inSteal && tp.score != null && tp.score > restant;
    const exact = !perdu && !inSteal && tp.score === restant && restant > 0;   // tombe pile sur le restant!
    const mustPass = perdu || trop;
    const canBank = !mustPass && tp.score >= (inSteal ? DES_VOL_MIN_PROD : (myScore > 0 ? 1 : T.OUVRAGE));
    const diceBadge = !perdu
      ? `<span class="diceleft" style="color:${dieValueColor(diceLeft)};border-color:${dieValueColor(diceLeft)};background:${dieValueColor(diceLeft)}1f" title="Nombre de dés qu'on va relancer">${diceLeft} dés</span>` : '';
    const tropMsg = trop ? `<div class="dmsg warn">⚖️ C'est trop : ${fmt(tp.score)} dépasse le restant (${fmt(restant)}). Tu ne peux pas encaisser — passe ton tour (dés perdus).</div>` : '';
    const passerLab = trop ? `C'est trop — passer à ${esc((OL.g && OL.g.names[dNextI()]) || '')}`
      : `Passer à ${esc((OL.g && OL.g.names[dNextI()]) || '')}`;
    // Boutons : si l'on doit passer (perdu/trop), on ne montre PAS Relancer/Encaisser, juste « Passer ».
    // Si l'on tombe exactement sur le restant : bouton « Encaisser et terminer la partie ! ».
    const bar = mustPass
      ? `<div class="actions" style="grid-template-columns:1fr;margin-top:8px">
          <button class="act ok" data-a="olost">${passerLab}</button>
        </div>`
      : (exact
          ? `<div class="actions" style="grid-template-columns:1fr;margin-top:8px">
              <button class="act ok" data-a="obank">🏆 Encaisser et terminer la partie !</button>
            </div>`
          : `<div class="dice-wrap">
              <button class="reroll" data-a="oroll" style="flex:1">🎲 Relancer</button>
              ${(tp && (tp.kept || []).length > 0) ? `<button class="reroll" data-a="orollall" style="flex:1">♻️ Tout (6 dés)</button>` : ''}
            </div>
            <div class="actions" style="grid-template-columns:1fr;margin-top:8px">
              <button class="act ok" data-a="obank" ${canBank ? '' : 'disabled'}>${inSteal ? 'Encaisser le vol' : 'Arrêter & encaisser'}</button>
            </div>`);
    return `<div class="dgrid">${cells}</div>
      ${diceBadge ? `<div class="dice-wrap"><span></span>${diceBadge}</div>` : ''}
      ${tropMsg}
      ${bar}`;
  }
  function dNextI() { const n = (OL.g && OL.g.names.length) || 0; return n ? (OL.g.current + 1) % n : 0; }
  function showOTurn(t) {
    if (!t) return '';
    const g = OL.g || {};
    const who = g.names[g.current] || '';
    const die = (d) => d.kept ? dDie(d.v, true, jetColor(d.jet)) : dDie(d.v, false, '');
    if (t.type === 'perdu') {
      const lost = (t.handLost || []).map(v => ({ v, jet: 0, kept: false }));
      return `<div class="dgrid"><div class="dgroup"><small>${esc(who)} — lancer perdant (aucun point)</small><div class="div">${lost.map(die).join('')}</div></div></div>`;
    }
    if (t.type !== 'rolling') return '';
    const curJet = t.lancers || 1;
    const keptCur = (t.kept || []);
    const current = (t.inHand || []).map(v => ({ v, jet: curJet, kept: keptCur.includes(v) }));
    const keptHtml = (OL.keptByRoll || []).reduce((acc, gr) => acc.concat((gr.dice || []).map(v => ({ v, jet: gr.jet, kept: true }))), []);
    const keptBlock = keptHtml.length ? `<div class="dgroup"><small>Dés tenus (${keptHtml.length})</small><div class="div">${keptHtml.map(die).join('')}</div></div>` : '';
    const comb = (t.combinaison && t.combinaison !== 'unités') ? ` · <b>${esc(t.combinaison)}</b>` : '';
    return `<div class="dgrid">${keptBlock}
      <div class="dgroup"><small>${esc(who)} · lancer n°${curJet} : ${fmt(t.gained || 0)} pts${comb}</small><div class="div">${current.map(die).join('')}</div></div>
      <p class="dturn"><span class="dlab">Total du tour</span><span class="damt">${fmt(t.score || 0)}</span></p>
    </div>`;
  }

  const root = document.getElementById('root');
  function render() {
    // Cette version est dédiée au jeu de dés (mode tableau retiré de l'UI) :
    // la page principale est l'écran dés (accueil sans partie, ou jeu en cours).
    if (!inDesMode()) { MODE = 'des'; saveMode(); if (!DS.screen) DS.screen = 'setup-des'; }
    root.innerHTML = DS.screen === 'game-des' ? viewGameDes() : DS.screen === 'dethist' ? viewDesHist()
    : DS.screen === 'roster' ? viewRoster()
    : DS.screen === 'ojoin' ? viewOJoin() : DS.screen === 'host' ? viewOHost() : DS.screen === 'ogame' ? viewOGame()
    : DS.screen === 'ostats' ? viewOStats() : viewSetupDes();
    const panel = document.getElementById('panel');
    document.documentElement.style.setProperty('--panel-h', (panel ? panel.offsetHeight : 0) + 'px');
  }
  function renameDes(i, name) {
    if (i >= 0 && i < DS.names.length) { DS.names[i] = String(name == null ? '' : name); saveDes(); }
  }
  function scrollToActive() {
    const el = document.getElementById('row-' + S.current);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (S.sound !== false) { audio(); unlockSpeech(); }
    if (b && !b.disabled) dAct(b.dataset.a, b.dataset.v);
  });
  document.addEventListener('input', e => {
    const i = e.target.dataset && e.target.dataset.name;
    if (i !== undefined) {
      Object.assign(S, E.reduce(S, { type: 'rename', i: +i, name: e.target.value }).state);
      save();
    }
    const di = e.target.dataset && e.target.dataset.dname;
    if (di !== undefined && inDesMode()) renameDes(+di, e.target.value);
    const pn = e.target && e.target.id === 'p-name';
    if (pn) editingName = e.target.value.slice(0, 18);
    const oc = e.target && e.target.id === 'o-code';
    if (oc) OL.order = e.target.value.replace(/\D/g, '').slice(0, 4);
  });
  document.addEventListener('change', e => {
    const pn = e.target && e.target.id === 'p-name';
    if (pn) { editingName = e.target.value.slice(0, 18); render(); }
    const i = e.target.dataset && e.target.dataset.name;
    if (i !== undefined && !e.target.value.trim()) {
      Object.assign(S, E.reduce(S, { type: 'rename', i: +i, name: `Joueur ${+i + 1}` }).state);
      save(); render();
    }
    const di = e.target.dataset && e.target.dataset.dname;
    if (di !== undefined && inDesMode() && !e.target.value.trim()) {
      renameDes(+di, `Joueur ${+di + 1}`); render();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sheet) { sheet = null; render(); }
  });
  window.addEventListener('resize', () => {
    const panel = document.getElementById('panel');
    if (panel) document.documentElement.style.setProperty('--panel-h', panel.offsetHeight + 'px');
  });

  // Keep the screen on while a game is open (ignored where unsupported).
  let wake = null;
  async function keepAwake() {
    try {
      if ((S.screen === 'game' || DS.screen === 'game-des') && 'wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { wake = null; }
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', keepAwake);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  render();
  keepAwake();
})();

</script>
</body>
</html>
